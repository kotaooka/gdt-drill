<style>
/* レイアウト：方眼紙の地にマークシート型の解答欄。上部タブで5画面を切替える1カラムアプリ */

}

  --accent:#72b6d6; --accent-soft:#1b3340; --ucl:#ef7b64; --ucl-soft:#3a201b; --ok:#6cc290; --ok-soft:#18332a; --warn:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10171b; --grid:rgba(111,179,210,.06); --card:#172126; --ink:#e2eaed; --muted:#93a5ac; --line:#2a3a41;
  --accent:#72b6d6; --accent-soft:#1b3340; --ucl:#ef7b64; --ucl-soft:#3a201b; --ok:#6cc290; --ok-soft:#18332a; --warn:#e0a84a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}

.mstart{display:grid;gap:8px}.mstart .btn{flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:56px}.mstart .btn span{font-weight:400;font-size:.85rem;opacity:.85}
.fgrp{padding:0;margin-bottom:10px;overflow:hidden}.fgrp summary{padding:14px 16px;font-weight:700;cursor:pointer;min-height:44px;box-sizing:border-box}
.frow{padding:10px 16px;border-top:1px solid var(--line)}
.fsym{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0;padding:10px 16px 12px;background:var(--accent-soft);border-top:1px solid var(--line);font-size:.85rem}
.fsym .fsh{grid-column:1/-1;font-weight:700;color:var(--accent);font-size:.8rem}.fsym dt{font-weight:700;max-width:7.5em;overflow-wrap:anywhere}.fsym dd{margin:0;color:var(--ink)}.frow .fn{font-size:.82rem;color:var(--muted);font-weight:700}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.start{display:grid;gap:10px}

/* 分野別の正答率バー（50%線＝分野合格目安） */

.catrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

.catrow .nm{font-size:.88rem;min-width:0}

/* 分野選択チップ */
.chips{display:flex;flex-wrap:wrap;gap:6px}

.opt .tx{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.fb{margin-top:14px;padding:14px 16px;border-radius:6px;border:2px solid var(--line);background:var(--paper);animation:fbIn .22s ease-out}

.opt{transition:transform .08s ease,border-color .1s}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}

.qfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;margin-top:10px}
.msec{margin-top:12px}.msech{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:.9rem;color:var(--accent);padding:4px 0;border-bottom:2px solid var(--accent)}.msech span{font-size:.78rem;color:var(--muted);font-weight:400}

.mhead b{font-size:.85rem}.mhead .t{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lnk span{font-size:.8rem;color:var(--muted)}
.refrow{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 12px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:.85rem;border-radius:4px;transition:background .3s}
.refrow:last-child{border-bottom:0}
.refrow .nm{font-weight:700}
.refrow .nm .lbl{display:block}
.refrow.hit{background:var(--accent-soft)}
.jis{font-family:var(--f-num);color:var(--accent);white-space:nowrap}
.about p{margin:6px 0}
.ver-big{font-family:var(--f-num);font-size:1.6rem;font-weight:600;color:var(--accent)}
.ver-big small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:10px}
.hist{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 10px;padding:6px 0;font-size:.85rem;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist b{font-family:var(--f-num)}
.hist .d{font-family:var(--f-num);color:var(--muted)}
.appfoot{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);text-align:center}
.appfoot .ver{font-family:var(--f-num);color:var(--accent);font-weight:600}
@media (max-width:520px){.refrow{grid-template-columns:1fr}.hist{grid-template-columns:auto 1fr}.hist span:last-child{grid-column:1/-1}}
@media (max-width:420px){.kpi .v{font-size:1.2rem}.crit .v{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.streakchip{font-family:var(--f-num);font-size:.78rem;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 8px;align-self:center}
.streakchip.pending{opacity:.6}
.today .trow{display:flex;gap:14px;align-items:center}
.flame{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:1.3rem;border:2px solid var(--line);color:var(--muted)}
.flame.on{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.gbar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{text-align:center;border:1px solid var(--line);border-radius:4px;padding:4px 0;font-size:.75rem}
.day .w{display:block;color:var(--muted)}.day .m{display:block;font-family:var(--f-num);font-weight:600;min-height:1.4em}
.day.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.day.fz{border-color:var(--accent);color:var(--accent)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.story{font-family:var(--f-disp);margin:8px 0;line-height:1.8}
.story.clear{color:var(--ok)}
.pathmsg{font-weight:700;color:var(--accent);margin:8px 0 0}
.chap{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:0 14px}
.chap>summary{display:flex;gap:12px;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
.chap>summary::-webkit-details-marker{display:none}
.cno{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);font-family:var(--f-num);font-weight:600}
.chap.done .cno{background:var(--ok);border-color:var(--ok);color:var(--card)}
.chap.locked .cno{border-color:var(--line);color:var(--muted)}
.ct{font-weight:700}.ct small{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.chap[open]{padding-bottom:14px}
.stages{display:grid;gap:8px}
.stage{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--paper);border-radius:4px;padding:10px 12px;cursor:pointer;min-height:44px}
.stage.done{border-left-color:var(--ok)}
.stage:disabled{opacity:.45;cursor:not-allowed;border-left-color:var(--line)}
.stage .sn small{display:block;font-size:.75rem;color:var(--muted)}
.stars{font-size:1rem;color:var(--warn);white-space:nowrap;letter-spacing:.05em}
.setgrid{display:grid;gap:14px}
.oldhist summary{cursor:pointer;color:var(--accent);font-size:.85rem;margin-top:6px}

/* ===================================================================
   v1.6.0 外観：Android アプリの作法（上部アプリバー・下部ナビゲーション・ボトムシート）
   図案の主役は「マークシートの楕円」。学習ロードの各ステージを塗りつぶす楕円で表す。
   色は管理図の配色：中心線の青（主色）、管理限界の赤（不正解）、安定の緑（正解）、注意の琥珀（連続記録）。
   =================================================================== */
:root{--r-xl:24px;--r-lg:16px;--r-md:12px;--r-sm:8px;--pri:var(--accent);--on-pri:#fff;--pri-c:#d3e7f0;--on-pri-c:#0d3a4f;--surf2:#e9efed;--elev:0 1px 2px rgba(16,40,52,.08),0 2px 8px rgba(16,40,52,.06);--nav-h:72px;--flame:#c77412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero-bg:#1b4256;--hero-fg:#e6f2f7;--pri-c:#1d3a48;--on-pri:#06212d;--on-pri-c:#cfe6f2;--surf2:#1d292e;--elev:0 1px 2px rgba(0,0,0,.4);--flame:#f0a43a}}
:root[data-theme="dark"]{--hero-bg:#1b4256;--hero-fg:#e6f2f7;--pri-c:#1d3a48;--on-pri:#06212d;--on-pri-c:#cfe6f2;--surf2:#1d292e;--elev:0 1px 2px rgba(0,0,0,.4);--flame:#f0a43a}
html{-webkit-tap-highlight-color:transparent;font-size:calc(16px * var(--fs,1))}
/* 数字は桁がそろう等幅の数字にする（書体は本文と同じ） */
body{font-variant-numeric:tabular-nums}
body{font-size:calc(15px * var(--fs,1));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.wrap{padding-block:8px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
body.focus .wrap{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--f-body);font-size:1.05rem;font-weight:700;margin:28px 4px 10px;letter-spacing:.02em}
.lbl{letter-spacing:.04em;font-size:.75rem}
.panel{border-radius:var(--r-lg);border-color:transparent;box-shadow:var(--elev);padding:18px}
.note{line-height:1.6}
/* アプリバー */
header.appbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
header.appbar .bar{max-width:760px;margin:0 auto;height:60px;padding:0 8px 0 16px;display:flex;align-items:center;gap:6px}
.brandmark{width:28px;height:28px;flex:none;color:var(--pri)}
.brand{font-family:var(--f-body);font-weight:700;font-size:1.08rem;letter-spacing:.02em;margin:0 auto 0 6px;white-space:nowrap}
.iconbtn{width:48px;height:48px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--surf2)}
.iconbtn svg,.bnav svg,.tile svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.streakbtn{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 8px;border-radius:999px;border:0;background:transparent;font-family:var(--f-num);font-weight:600;font-size:1rem;color:var(--muted);cursor:pointer}
.streakbtn svg{width:22px;height:22px;fill:currentColor;stroke:none}
.streakbtn.on{color:var(--flame)}
/* 下部ナビゲーション */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:700;padding:0}
nav.bnav .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
nav.bnav button[aria-selected="true"]{color:var(--ink)}
nav.bnav button[aria-selected="true"] .pill{background:var(--pri-c);color:var(--on-pri-c)}
body.focus nav.bnav{display:none}body.focus #srchBtn{display:none}
/* ボタン類 */
.btn{border-radius:999px;min-height:48px;padding:10px 22px;letter-spacing:.02em;border:0}
.btn.ghost{border:1px solid var(--line);color:var(--pri);background:var(--card)}
.btn.tonal{background:var(--pri-c);color:var(--on-pri-c)}
.btn.danger{border:1px solid var(--ucl)}
.btn.sm{min-height:36px;padding:4px 14px}
.btn.block{width:100%}
.btn:active:not(:disabled){transform:scale(.98)}
.seg{border-radius:999px;border-color:var(--line);background:var(--card)}
.seg button{padding:9px 16px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--pri-c);color:var(--on-pri-c)}
.chip{border-radius:var(--r-sm);padding:8px 12px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--pri-c);color:var(--on-pri-c);border-color:transparent}
/* サブタブ（演習：分野別／実力診断、資料：資料／早見表） */
.subtabs{display:flex;gap:4px;padding:4px;margin:8px 0 4px;background:var(--surf2);border-radius:999px}
.subtabs button{flex:1;border:0;background:none;border-radius:999px;min-height:40px;font-weight:700;color:var(--muted);cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--elev)}
/* ホーム：今日のカード */
.hero{background:var(--hero-bg,var(--pri));color:var(--hero-fg,#fff);border-radius:var(--r-xl);padding:20px;margin-top:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}
.hero>*{position:relative}
.hero .exam{font-size:.85rem;opacity:.9}
.hero .days{font-family:var(--f-num);font-size:3rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero .days small{font-family:var(--f-body);font-size:1rem;font-weight:700;margin-left:4px;letter-spacing:0}
.hero .sub{font-size:.78rem;opacity:.85;margin-top:4px}
.hero .row{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;margin-left:auto}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:color-mix(in srgb,currentColor 22%,transparent)}.ring .fg{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{fill:currentColor;font-family:var(--f-num);font-weight:600;text-anchor:middle}
.hero .goalline{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:10px;font-size:.88rem}
.hero .goalline svg{width:22px;height:22px;fill:currentColor;flex:none}
.week{gap:8px;margin-top:4px}
.day{border:0;background:var(--surf2);border-radius:var(--r-md);padding:6px 0}
.day.ok{background:var(--ok);color:#fff}.day.ok .w{color:rgba(255,255,255,.85)}
.day.fz{background:var(--pri-c);color:var(--on-pri-c)}
.day.today{outline:2px solid var(--pri);outline-offset:2px}
/* ホーム：続きから・タイル */
.cont{display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;border:0;font:inherit;color:inherit}
.cont .oval{flex:none}
.cont .t{font-weight:700;font-size:1rem}.cont .s{font-size:.8rem;color:var(--muted)}
.cont .go{margin-left:auto;color:var(--pri)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:0;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--elev);cursor:pointer;text-align:left;min-height:112px;color:var(--ink);font:inherit}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri-c);color:var(--on-pri-c)}
.tile b{font-size:.95rem}.tile span.sub{font-size:.75rem;color:var(--muted);line-height:1.4}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile:active:not(:disabled){transform:scale(.98)}
.kpi{border-left:0;text-align:center}
.kpi .v{font-size:1.6rem}
/* 学習ロード：マークシートの楕円が連なる道 */
.chapband{border-radius:var(--r-lg);padding:16px 18px;margin:24px 0 8px;background:var(--card);box-shadow:var(--elev);border-left:6px solid var(--pri)}
.chapband.done{border-left-color:var(--ok)}.chapband.locked{border-left-color:var(--line)}
.chapband .no{font-size:.78rem;color:var(--muted);font-weight:700}
.chapband .tt{font-size:1.1rem;font-weight:700;margin:2px 0}
.chapband .rl{font-size:.8rem;color:var(--muted)}
.chapband details summary{cursor:pointer;color:var(--pri);font-size:.82rem;font-weight:700;margin-top:6px;list-style:none}
.chapband details summary::-webkit-details-marker{display:none}
.trail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font:inherit;color:inherit;padding:4px}
.oval{width:76px;height:54px;border-radius:50%;border:3px solid var(--pri);display:grid;place-items:center;background:var(--card);color:var(--pri);font-family:var(--f-num);font-weight:600;font-size:1.15rem;box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 35%,transparent);transition:transform .1s}
.node:active .oval{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pri) 35%,transparent)}
.oval svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.node.done .oval{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 40%,transparent)}
.node.cur .oval{background:var(--pri);color:var(--on-pri);animation:breathe 2.4s ease-in-out infinite}
.node.locked{cursor:pointer}.node.locked .oval{border-style:dashed;border-color:var(--line);color:var(--muted);box-shadow:none;background:transparent}
.node .nm{font-size:.78rem;font-weight:700;max-width:11em;text-align:center;line-height:1.35}
.node.locked .nm{color:var(--muted);font-weight:400}
.node .st{font-size:.8rem;color:var(--flame);letter-spacing:.08em;min-height:1em}
.node.test .oval{width:120px;border-radius:999px;font-family:var(--f-body);font-size:.85rem}
@keyframes breathe{0%,100%{box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 35%,transparent),0 0 0 0 color-mix(in srgb,var(--pri) 30%,transparent)}50%{box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 35%,transparent),0 0 0 10px transparent}}
.rolebar{display:flex;align-items:center;gap:12px}
.rolebar .meter{flex:1;height:8px;border-radius:999px}
.rolebar .meter::after{display:none}
.rolebar .meter i{border-radius:999px;background:var(--ok)}
/* 問題画面：集中モード */
.qtop{display:flex;align-items:center;gap:8px;margin:4px -8px 8px}
.qtop .prog{flex:1;height:12px;border-radius:999px;margin:0;background:var(--surf2)}
.qtop .prog i{border-radius:999px;background:var(--ok)}
.qtop .cnt{font-family:var(--f-num);font-size:.85rem;color:var(--muted);min-width:3.5em;text-align:right}
.qcard{background:transparent;box-shadow:none;padding:4px 0}
.qtext{font-size:1.05rem;line-height:1.8}
.opt{border-radius:var(--r-md);border:2px solid var(--line);border-bottom-width:4px;padding:12px 14px;min-height:56px;background:var(--card)}
.opt .bub{width:32px;height:24px}
.opt.sel{background:var(--pri-c);border-color:var(--pri);box-shadow:none}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--ucl)}
.fb{border-radius:var(--r-lg);border-width:0;padding:16px 18px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));transition:background .2s}
.actionbar .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.actionbar .in.row{flex-direction:row;align-items:center}
.actionbar .in>.btn{width:100%;min-height:52px;font-size:1rem}
.actionbar .in.row>.btn{width:auto}
.actionbar .in.row>.btn.block{flex:1}
.actionbar .msg{flex:1;min-width:0;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.actionbar .msg .mk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;flex:none;font-size:1.1rem}
.actionbar .btn{min-width:150px}
.actionbar.ok{background:var(--ok-soft)}.actionbar.ok .msg{color:var(--ok)}.actionbar.ok .mk{color:var(--ok)}
.actionbar.ng{background:var(--ucl-soft)}.actionbar.ng .msg{color:var(--ucl)}.actionbar.ng .mk{color:var(--ucl)}
.actionbar.ok .btn{background:var(--ok)}.actionbar.ng .btn{background:var(--ucl)}
.actionbar .btn.ghost{min-width:0}

.mockhead{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.mockhead .timer{margin-left:auto;padding:6px 14px;border-radius:999px;background:var(--surf2)}
/* ボトムシート */
#scrim{position:fixed;inset:0;z-index:19;background:rgba(10,20,26,.45);animation:fade .2s}
.sheet{border-top:0;border-radius:28px 28px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);padding-top:8px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheethead{margin-bottom:12px}
.sheethead strong{font-size:1.15rem}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 設定の行 */
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;min-width:0}.srow .t b{display:block;font-size:.95rem}.srow .t span{display:block;font-size:.78rem;color:var(--muted);line-height:1.45}
.srow.col{flex-direction:column;align-items:stretch}
.switch{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:999px;background:var(--surf2);box-shadow:inset 0 0 0 2px var(--muted);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch[aria-checked="true"]{background:var(--pri);box-shadow:none}
.switch[aria-checked="true"]::after{left:24px;top:4px;width:24px;height:24px;background:var(--on-pri)}
select,input[type=time],input[type=date],input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-height:44px}
.setcard{background:var(--paper);border-radius:var(--r-lg);padding:4px 16px;margin-bottom:12px}
.setcard h3{font-size:.8rem;color:var(--pri);margin:12px 0 0}
#toast{bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));border-radius:var(--r-sm);padding:12px 18px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
body.focus #toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.appfoot{border-top:0}
@media (prefers-reduced-motion:reduce){.node.cur .oval{animation:none}}
/* 見やすさ・押しやすさ：操作部品は 44px 以上 */
.btn.sm{min-height:44px}
.chip,.seg button,.subtabs button{min-height:44px}
.streakbtn{height:44px}
.linkbtn{min-height:44px;display:inline-flex;align-items:center}
.chapband details summary,.oldhist summary,.syl summary{min-height:44px;display:flex;align-items:center}
.lnk a{display:inline-flex;align-items:center;min-height:44px}
.switch,.blank2,.qgrid button{position:relative}
.switch::before{content:"";position:absolute;inset:-8px -4px}
button.blank2{min-height:40px}button.blank2::before{content:"";position:absolute;inset:-4px 0}

['form','平面度の公差域として正しいものはどれか。',['距離 t の2平行平面のあいだ','直径 t の円筒の中','半径の差が t の同心2円のあいだ','データムに平行な距離 t の2平面のあいだ'],'平面度の公差域は、距離 t だけ離れた平行な2平面のあいだ。2平面の向きは自由で、データムを基準にしない。データムに平行な2平面は平行度の公差域。'],
['form','真円度の公差域として正しいものはどれか。',['同じ横断面で、半径の差が t の同心の2円のあいだ','直径 t の円の中','データム軸線を中心とする半径の差 t の2円のあいだ','半径の差が t の同軸の2円筒のあいだ'],'真円度は軸に垂直な各横断面で評価し、公差域は半径の差が t の同心2円のあいだ。円の中心はデータムではなく、その断面の輪郭に合わせて決める。2円筒のあいだは円筒度。'],
['form','円筒度の公差域として正しいものはどれか。',['半径の差が t の同軸の2円筒のあいだ','直径 t の円筒の中（軸線が入る範囲）','半径の差が t の同心の2円のあいだ（断面ごと）','距離 t の2平行平面のあいだ'],'円筒度は円筒の表面全体に指示し、公差域は半径の差が t の同軸2円筒のあいだ。1つの公差で、真円度・母線の真直度・テーパなどをまとめて規制する。'],
['form','円筒度の公差値に φ を付けない理由として正しいものはどれか。',['公差域が半径の差で決まる2円筒のあいだだから','円筒度には必ずデータムが必要で、φ が書けないから','円筒度は軸線にしか指示できず、表面には使えないから','φ を付けると、平面度の指示と区別できなくなるから'],'円筒度の公差域は直径 t の円筒ではなく、半径の差が t の2つの同軸円筒のあいだ。φ を付けると直径 t の円筒の意味になってしまうので誤り。真円度も同様に φ を付けない。'],
['form','軸線の真直度の公差値に φ を付けたときの公差域として正しいものはどれか。',['直径 t の円筒の中','距離 t の2平行平面のあいだ','半径の差が t の2円筒のあいだ','直径 t の球の中'],'軸線（誘導形体）の真直度に φ を付けると、公差域は直径 t の円筒の中。軸線がどの方向に曲がっても規制できる。',null,['fcf',{sym:'str',tol:'φ0.02'}]],
['form','円筒度が1つの公差でまとめて規制するものとして、適切でないものはどれか。',['データム軸線に対する位置','横断面の真円度（各断面の丸さ）','母線の真直度（表面の線のまっすぐさ）','テーパ（軸方向の直径の変化）'],'円筒度は形状公差なので、データムに対する位置や姿勢は規制しない。表面の形として、真円度・母線の真直度・テーパなどをまとめて規制する。'],
['form','データムを指示しない線の輪郭度の分類として正しいものはどれか。',['形状公差','姿勢公差','位置公差','振れ公差'],'線の輪郭度・面の輪郭度は、データムがなければ形状公差、データムに姿勢だけを関連させれば姿勢公差、位置まで関連させれば位置公差として扱う。'],
['form','平面度 0.05 を指示した面を3次元測定機で測った。判定に使う値として最も適切なものはどれか。',['全測定点を挟む2平行平面の最小の間隔','定盤から測った高さの、最大値と最小値の差','4隅の高さの平均からの、各点の最大のずれ','すべての測定点の高さの標準偏差の6倍'],'平面度の偏差は、測定点をすべて挟む平行2平面の間隔が最小になるとき（最小領域）の間隔で評価する。定盤に置いて高さの差をとる方法は、面の傾きを含んでしまい、大きめに出ることがある。'],

// --- 姿勢公差 ---
['orient','平行度（面）の公差域として正しいものはどれか。',['データムに平行で、距離 t の2平行平面のあいだ','向きを問わない、距離 t の2平行平面のあいだ','データムに直角で、距離 t の2平行平面のあいだ','データム平面から、上下に距離 t ずつの範囲のあいだ'],'平行度の公差域は、データム平面に平行な2平面のあいだで、その間隔が t。向きはデータムに固定されるが、位置（データムからの高さ）は規制しない。',null,['block',{fcf:{sym:'par',tol:'0.05',dats:['A']}}]],
['orient','図の側面に指示した公差の意味として正しいものはどれか。',['A に直角で間隔 0.05 の2平面のあいだに側面が入る','側面の平面度が 0.05 以内であればよく、向きは問わない','側面がデータム A から 0.05 の位置にあることを求める','側面の真直度が、どの断面でも 0.05 以内であればよい'],'⊥ は直角度。側面は、データム A に直角な2平行平面（間隔 0.05）のあいだに入らなければならない。姿勢公差なので、データム A からの位置は規制しない。',null,['block',{face:'side',fcf:{sym:'perp',tol:'0.05',dats:['A']}}]],
['orient','傾斜度で、公差域の角度を決めるために使うものはどれか。',['理論的に正確な角度（枠囲みの角度）','角度に付けたサイズ公差（± の公差）','普通寸法公差（JIS B 0405）の角度の許容差','データム文字の数と、その優先順位'],'傾斜度は、データムに対して理論的に正確な角度（TED）だけ傾いた2平行平面のあいだに公差域を設ける。角度に ± の公差を付けると、公差域の解釈があいまいになる。'],
['orient','上面に平行度 0.05（データム A）を指示した。同時に上面に対して規制されるものはどれか。',['平面度（0.05 以内）','データム A からの上面の高さ','上面の表面粗さ（算術平均粗さ）','側面のデータム A に対する直角度'],'平行度の公差域は2平行平面なので、その中に入る面は平面度も 0.05 以内に収まる。平面度をより厳しくしたいときは、平行度より小さい値で平面度を追加する。高さ（位置）は規制しない。'],
['orient','穴の軸線の平行度に φ を付けたときの公差域として正しいものはどれか。',['データム軸線に平行な直径 t の円筒の中','データム平面に平行な距離 t の2平面のあいだ','データム軸線を中心とする半径の差 t の2円筒のあいだ','データムに直角な直径 t の円筒の中'],'φ を付けると公差域は円筒になる。データムが軸線なら、データム軸線に平行な直径 t の円筒の中に穴の軸線が入ればよい。'],
['orient','姿勢公差が規制しないものはどれか。',['データムからの位置','データムに対する傾き','形体の形（姿勢公差の値以内）','公差域の向き'],'姿勢公差（平行度・直角度・傾斜度）は、データムに対する向きを規制し、結果として形も同じ値以内に規制する。データムからの位置は規制しないので、位置はサイズ公差や位置度で決める。'],

// --- 位置公差 ---
['loc','穴の位置度 φ0.1（データム A・B・C）の公差域として正しいものはどれか。',['真位置を軸とする直径 0.1 の円筒の中','穴の実際の中心を軸とする、直径 0.1 の円筒の中','真位置から x・y 方向にそれぞれ ±0.1 の正方形の中','データム A に平行な、距離 0.1 の2平面のあいだ'],'位置度の公差域は、データムと理論的に正確な寸法で決まる真位置を中心にした直径 t の円筒。穴の軸線がこの中に入れば合格。座標で ± の公差を与えると、公差域は正方形になる。',null,['plate',{fcf:{sym:'pos',tol:'φ0.1',dats:['A','B','C']}}]],
['loc','図の穴の位置を決める寸法 40 と 30 に枠が付いている理由として、正しいものはどれか。',['真位置を決める TED で、ばらつきは位置度で許すため','重要寸法であることを示し、全数検査を求めるため','普通寸法公差（JIS B 0405）を適用することを示すため','参考寸法で、検査の対象にしないことを示すため'],'位置度を使うときは、真位置を理論的に正確な寸法（TED）で決める。TED 自体には公差がなく、穴の位置のばらつきは位置度の公差域で許す。',null,['plate',{fcf:{sym:'pos',tol:'φ0.2',dats:['A','B','C']}}]],
['loc','座標寸法の ±0.05 で穴の位置を決める方法と比べて、位置度（φ）で決める利点として正しいものはどれか。',['同じ最大のずれを許す円の公差域は、正方形より約57%広い','測定をしなくても、図面だけで合否を判定できるようになる','データムを指示しなくても、穴の位置を決められるようになる','加工の精度を高くしなくても、必ず組み付けられるようになる'],'±0.05 の正方形の公差域で許される対角方向のずれを、全方向に許す円（外接円）にすると、面積は約1.57倍になる。機能（ボルトが通るか）は方向によらないので、円の公差域のほうが合理的。'],
['loc','同軸度の公差域として正しいものはどれか。',['データム軸線と同軸の、直径 t の円筒の中','データム軸線から半径 t より外側の、円筒の外の範囲','半径の差が t の同軸の2円筒のあいだ（表面の範囲）','データム軸線に平行で、距離 t の2平面のあいだ'],'同軸度は、対象の軸線がデータム軸線と同軸の直径 t の円筒の中に入ることを求める。軸線（誘導形体）への指示なので、矢印は寸法線の延長上に当て、φ を付ける。',null,['shaft',{fcf:{sym:'coax',tol:'φ0.02',dats:['A']}}]],
['loc','対称度の公差域として正しいものはどれか。',['データム中心平面に対称な、距離 t の2平面のあいだ','データム中心平面から片側に距離 t の範囲（合計 2t）','データム中心平面上の軸を中心とする直径 t の円筒の中','半径の差が t の、同心の2円のあいだ'],'対称度は、溝や突起の中心平面が、データム中心平面に対称な2平行平面（間隔 t）のあいだに入ることを求める。片側に t ずつではなく、合計の幅が t。'],
['loc','位置度の公差を φ なしで指示した場合（例：位置度 0.1、1方向だけ）の公差域として正しいものはどれか。',['真位置に対称な、距離 0.1 の2平行平面のあいだ','真位置を中心とする直径 0.1 の円（どの方向にも 0.05）','真位置から片側だけに 0.1 の範囲（反対側は 0）','真位置を中心とする半径 0.1 の円（直径 0.2）'],'φ がなければ、公差域は矢印の方向に幅 t をもつ2平行平面（または2直線）のあいだで、真位置に対称に置く。溝の中心平面の位置などに使う。'],

// --- 輪郭度 ---
['prof','面の輪郭度の公差域として正しいものはどれか。',['理論的な輪郭上に中心をもつ直径 t の球の包絡面2つのあいだ','輪郭の各点から、材料の外側にだけ t の範囲','理論的な輪郭を中心線とする、直径 t の円筒の中','輪郭に外接する2つの平行平面のあいだ（間隔 t）'],'面の輪郭度は、理論的に正確な輪郭（TED で定義）の上に中心をもつ直径 t の球を並べ、その包絡面2つのあいだが公差域。特に指示がなければ、輪郭の両側に t/2 ずつ均等に広がる。'],
['prof','線の輪郭度の公差域として正しいものはどれか。',['理論的な輪郭上に中心をもつ直径 t の円の包絡線2本のあいだ','理論的な輪郭の両端を結ぶ線に平行な2直線のあいだ','半径の差が t の、同心の2円のあいだ（各断面）','理論的な輪郭上に中心をもつ直径 t の球の包絡面2つのあいだ'],'線の輪郭度は、指示した方向の各断面で評価する。理論的に正確な輪郭の上に中心をもつ直径 t の円を並べ、その包絡線2本のあいだが公差域。'],
['prof','データム A・B を指示した面の輪郭度が規制するものとして正しいものはどれか。',['輪郭の形と、データムに対する姿勢・位置','輪郭の形だけ（データムは参考として扱う）','データムに対する姿勢だけ（位置は規制しない）','輪郭の大きさ（サイズ）だけを規制する'],'輪郭度にデータムを指示すると、理論的に正確な輪郭がデータムに対して決まった位置に固定される。そのため、形だけでなく姿勢と位置も同時に規制する。'],
['prof','面の輪郭度で、理論的に正確な輪郭を定義するものはどれか。',['理論的に正確な寸法（または3次元モデル）','輪郭の各点に ± で付けたサイズ公差','普通寸法公差（JIS B 0405）の許容差','複数の部品を測定した輪郭の平均'],'輪郭度は、理論的に正確な輪郭からのずれを規制する。輪郭は TED で定義し、各点に ± の公差は付けない。3次元モデルで定義する場合もある。'],

// --- 振れ公差 ---
['run','円周振れの測定方法として正しいものはどれか。',['1回転させ、各測定位置で指示値の最大と最小の差を読む','回転させながら測定子を軸方向に動かし、全体の最大と最小の差を読む','止めたまま、3か所の直径を測って、最大と最小の差をとる','データム軸線から表面までの距離を、何点か測って平均する'],'円周振れは、データム軸線のまわりに部品を1回転させ、測定子を固定した各位置で、指示値の最大と最小の差を読む。測定子を軸方向に動かしながら全体で評価するのは全振れ。'],
['run','全振れの説明として正しいものはどれか。',['回転させながら測定子を表面全体に沿って動かして評価する','1回転させて、1つの断面だけで指示値の最大と最小の差を評価する','回転させずに、表面の母線の真直度を何本か測って評価する','データムを使わずに、表面全体の円筒度として評価する'],'全振れは、データム軸線のまわりに回転させながら、測定子を軸方向（端面なら半径方向）に動かし、表面全体での指示値の最大と最小の差を評価する。円周振れより厳しい。'],
['run','半径方向の円周振れが規制するものとして正しいものはどれか。',['横断面の真円度と、データム軸線に対する偏心を合わせたもの','横断面の真円度だけ（データム軸線に対する偏心は含まない）','データム軸線に対する傾きだけ（断面の形は含まない）','直径のサイズだけ（2点測定による直径）'],'半径方向の円周振れは、断面の形のくずれ（真円度）と、データム軸線に対する中心のずれ（偏心）を合わせた結果として現れる。偏心 e だけがある場合、振れは約 2e になる。',null,['shaft',{}]],
['run','端面に指示した軸方向の円周振れが主に規制するものはどれか。',['各円周上での、データム軸線方向のふらつき','端面全体の平面度（各円周の位置の差を含む）','端面の外径の直径と、その真円度','端面の表面粗さと、加工の目の向き'],'軸方向の円周振れは、各半径の円周上で、軸方向の変位（ふらつき）を規制する。端面全体の平面度や直角度を規制したいときは、全振れや直角度を使う。'],
['run','振れ公差の検査でデータム軸線を設定する方法として、最も適切なものはどれか。',['データム形体を V ブロックや両センタで支持して回転させる','測定する面そのものを V ブロックで支持して回転させる','部品を定盤に置き、回転させずにダイヤルゲージで測る','任意の向きで部品を手に持ち、指示値を見ながら回転させる'],'振れは、データム軸線のまわりに回転させたときの変位で評価する。データム形体（軸受部など）を支持して回転させる。測定する面自体を支持すると、データムに対する振れにならない。'],

// --- 最大実体公差方式 ---
['mmc','公差値の後ろの Ⓜ の意味として正しいものはどれか。',['実寸法が最大実体寸法から離れた分だけ公差を増やせる','最大実体寸法の状態で、幾何公差を測定することを求める','公差値を、ばらつきの最大値として扱うことを示す','測定の不確かさの分を、公差から差し引いて判定する'],'Ⓜ は最大実体公差方式。形体の実寸法が最大実体寸法（MMS）から離れるほど、はめあいに余裕ができるので、その差だけ幾何公差を増やしてよい（ボーナス公差）。',null,['fcf',{sym:'pos',tol:'φ0.1(M)',dats:['A','B']}]],
['mmc','最大実体公差方式を適用できるものとして正しいものはどれか。',['サイズ形体の軸線や中心平面に指示した公差','1つの平面（サイズのない形体）に指示した平面度','円筒の表面に指示した円周振れや全振れ','データムを指示した面の輪郭度（曲面の表面）'],'最大実体公差方式は、サイズ形体（穴・軸・溝など）の誘導形体（軸線・中心平面）に指示した公差にだけ適用できる。サイズをもたない平面や表面には、実寸法がないので使えない。'],
['mmc','位置度「φ0 Ⓜ」（ゼロ幾何公差）の意味として正しいものはどれか。',['MMS では位置度 0、実寸法の余裕分だけ位置度を許す','位置のずれを、実寸法によらずまったく許さない','位置度は検査しなくてよく、サイズだけを測ればよい','サイズ公差を 0 にして、位置度だけで管理する'],'φ0 Ⓜ は、最大実体寸法では幾何公差を 0 とし、実寸法が最大実体寸法から離れた分だけ位置のずれを許す。サイズ公差と幾何公差の配分を、実際の加工結果に合わせて自由に使える。'],
['mmc','最大実体公差方式を指示した穴の位置度を、機能ゲージで検査する。ゲージのピンの直径として正しいものはどれか。',['穴の実効寸法（MMS−位置度の公差値）','穴の最大実体寸法（最小の許容寸法）そのもの','穴の最小実体寸法（最大の許容寸法）そのもの','穴の実効寸法に、位置度の公差値を足した値'],'機能ゲージのピンは、穴の実効寸法（穴の最大実体寸法から幾何公差を引いた値）で作る。ピンが入れば、どの組合せでも相手の部品が組み付けられる。サイズそのものは別に測る。'],
['mmc','最小実体公差方式（Ⓛ）を使う目的として最も適切なものはどれか。',['最小肉厚など、材料が最も少ない状態での強度を確保する','相手部品とのはめあいで、組み付けられることを確保する','測定の手間を減らして、受入検査の時間を短くする','表面粗さと形状を、1つの指示でまとめて規制する'],'Ⓛ は、実寸法が最小実体寸法から離れる（材料が増える）ほど公差を増やす。穴と外形のあいだの最小肉厚を確保したい場合などに使う。組付け性の確保には Ⓜ を使う。'],
['mmc','ねじ穴の位置度に Ⓟ を付ける目的として最も適切なものはどれか。',['相手部品の厚さぶん、穴の外に突き出した範囲に公差域を設ける','ねじ穴の深さ全体に公差域を設けて、穴の中で評価する','ねじの有効径で測定することを示し、外径では測らない','ねじ穴の位置度の公差値を、2倍に広げて適用する'],'Ⓟ は突出公差域。植込みボルトやねじ穴では、ボルトが相手部品を通る部分（穴の外側）の位置が問題になる。穴の傾きの影響を含めて規制するため、突き出した長さの範囲に公差域を設ける。'],

// --- ISO 1101:2017 との違い ---
['iso','JIS B 0021:1998 が一致規格として対応する国際規格はどれか。',['ISO/DIS 1101:1996','ISO 1101:2017（最新版）','ISO 1101:2012（前の版）','ISO 8015:2011（基本原則）'],'JIS B 0021:1998 は、当時の国際規格案 ISO/DIS 1101:1996 と一致させて作られた。その後 ISO 1101 は2012年・2017年に改正されたが、JIS B 0021 は改正されていない（2018年に確認。2023年の見直し審議でも、改正をいったん見送って確認とする方針になった）。'],
['iso','ISO 1101:2017 で、複数の形体に1つの共通の公差域を適用するときに公差値の後ろに書く記号はどれか。',['CZ','UZ','ACS','SZ'],'CZ は共通公差域（combined zone）。例えば同じ平面上にある複数の面を、1つの平面度の公差域にまとめて入れたいときに使う。JIS B 0021:1998 では、公差記入枠の上に「共通公差域」と書く方法を示している。'],
['iso','ISO 1101:2017 で輪郭度の公差値に「UZ」を付けたときの意味として正しいものはどれか。',['公差域の中心を、理論的な輪郭から指定した量ずらす','公差域を輪郭の片側だけに置き、反対側は 0 にする','複数の面の公差を、1つの共通公差域にまとめる','輪郭度にデータムを使わないことを明示する'],'UZ は、公差域を理論的に正確な輪郭に対して指定した量だけずらす（オフセットする）指示。均等に両側に広がる既定の公差域では都合が悪い場合に使う。JIS B 0021:1998 には無い指示。'],
['iso','ISO 1101:2017 の「交差平面指示子」の用途として正しいものはどれか。',['線要素を評価する断面の向きを、データムとの関係で指定する','公差を適用する範囲の長さを、断面ごとに指定する','データムの優先順位を、公差記入枠とは別に入れ替える','公差値の単位を、mm 以外に指定するときに使う'],'交差平面指示子は、表面上の線要素（真直度や線の輪郭度など）を、どの向きの断面で評価するかを指定するために、公差記入枠の右側に付ける枠。3次元モデルで指示する場合に、解釈をあいまいにしないために使う。'],
['iso','JIS B 0024:2019（ISO 8015:2011 に対応）が定める既定の原則として正しいものはどれか。',['独立の原則','包絡の条件','最大実体公差方式','最小実体公差方式'],'JIS B 0024:2019 は ISO 8015:2011 に対応し、GPS の基本原則として独立の原則を既定とする。包絡の条件が必要なら Ⓔ などで個別に指示する。ASME Y14.5 では既定が包絡の条件（Rule #1）なので逆になる。'],
['iso','JIS B 0021:1998 と ISO 1101:2017 の違いについて、実務上の注意として最も適切なものはどれか。',['図面がどの規格のどの版に基づくかを確認し、記号の解釈をそろえる','JIS のほうが新しいので、JIS の解釈を優先する','記号が同じなら、解釈も必ず同じとみなしてよい','ISO の新しい記号は JIS の図面でも自由に使ってよい'],'ISO 1101:2017 には、JIS B 0021:1998 にない記号や指示（CZ・UZ・交差平面指示子など）がある。海外との取引では、図面が準拠する規格と版を確認し、解釈を取り決めておくことが重要。'],

// --- ASME Y14.5 との違い ---
['asme','ASME Y14.5 の Rule #1 の内容として正しいものはどれか。',['サイズ形体は MMS の完全形状の境界を超えない（包絡）','サイズ公差と幾何公差は、互いに独立に適用する','すべての幾何公差に、最大実体公差方式を自動的に適用する','データムは必ず3つ指示し、3平面データム系をつくる'],'ASME Y14.5 の Rule #1 は、サイズ形体の表面が最大実体寸法の完全形状の境界を超えてはならないとする（包絡の原則）。JIS（JIS B 0024）では独立の原則が既定で、包絡の条件は Ⓔ で指示するので、扱いが逆になる。'],
['asme','ASME Y14.5-2018 で廃止された幾何特性の記号はどれか。',['同心度と対称度','真直度と平面度','位置度と輪郭度','円周振れと全振れ'],'ASME Y14.5-2018 では同心度（concentricity）と対称度（symmetry）の記号が廃止された。代わりに位置度・振れ・輪郭度で指示する。JIS・ISO では同心度・同軸度と対称度を引き続き使う。'],
['asme','ASME Y14.5 で、公差記入枠に Ⓜ や Ⓛ を書かない場合の扱いとして正しいものはどれか。',['RFS（サイズに無関係）として扱う','MMC（最大実体）として扱う','LMC（最小実体）として扱う','公差を適用せず、参考値として扱う'],'ASME Y14.5 では、Ⓜ・Ⓛ を書かなければ RFS（形体のサイズに無関係）として扱う（Rule #2）。RFS を示す Ⓢ 記号は現在の版では使わない。'],
['asme','ASME Y14.5 で、データム文字に使わないものはどれか。',['I・O・Q','A・B・C','X・Y・Z','D・E・F'],'ASME Y14.5 では、数字と見誤りやすい I・O・Q をデータム文字に使わない。'],
['asme','ASME Y14.5 の basic dimension に相当する JIS の用語はどれか。',['理論的に正確な寸法','参考寸法（括弧付きの寸法）','基準寸法（公差の基準となる寸法）','普通寸法（普通公差を適用する寸法）'],'basic dimension は、枠で囲んで示す、公差をもたない理論的に正確な寸法（TED）に相当する。位置度・輪郭度などの公差域を決めるために使う。'],
['asme','ASME Y14.5 で、サイズ公差に Rule #1（包絡）を適用しないことを示す記号はどれか。',['Ⓘ（independency）','Ⓔ（envelope）','Ⓢ（regardless of feature size）','Ⓕ（free state）'],'ASME Y14.5（2009年版以降）では、Rule #1 を外して形状をサイズ公差から独立させたいときに Ⓘ（independency）を付ける。JIS とは逆で、JIS では独立が既定で、包絡が必要なときに Ⓔ を付ける。'],
['asme','ASME Y14.5 で、データム参照の後ろに Ⓜ を付けたときの意味として正しいものはどれか。',['MMB（最大実体境界）でデータム形体を模擬する','データムには最大実体公差方式を適用しないことを示す','データム形体を、最小実体寸法の境界で模擬する','そのデータム形体は測定しなくてよいことを示す'],'ASME Y14.5（2009年版以降）では、データム参照の後ろの Ⓜ は MMB（最大実体境界）を意味し、データム形体を固定した大きさの境界で模擬する。データム形体と境界のすき間の分だけ、データムシフトが生じる。'],
// --- 追加：幾何公差の考え方 ---
['basic','公差域の中での形体の形や向きについて、正しいものはどれか。',['公差域の中に入っていれば、形や向きは問わない','公差域の中心に近いほど良品として扱う','公差域の中でも、理想の形に近くなければならない','公差域の幅の半分以内に入らなければならない'],'特に指示がない限り、形体は公差域の中に入っていればよく、公差域の中での形や向きは問わない。中心に近いほど良いという段階の評価はしない。'],
['basic','公差を形体の一部の範囲だけに適用したいとき、範囲を示す線として正しいものはどれか。',['太い一点鎖線','細い破線','太い実線','細い二点鎖線'],'限られた範囲だけに公差を適用するときは、その範囲を太い一点鎖線で示し、寸法で位置と長さを指示する。'],
['basic','真直度の公差値を「0.02/100」と書いた場合の意味として正しいものはどれか。',['任意の長さ 100 mm ごとに 0.02 以内','全長がちょうど 100 mm の部品だけに適用する','100 か所で測って、そのすべてが 0.02 以内','0.02 を 100 倍した 2 mm を公差とする'],'公差値の後ろに斜線と長さを書くと、形体のどの位置でも、指定した長さの範囲ごとに公差を適用する。全長に対する公差と上下に並べて併記することもある。'],
// --- 追加：記号と公差記入枠 ---
['sym','同じ形体に平行度と平面度の2つを指示するときの書き方として正しいものはどれか。',['公差記入枠を上下に重ね、1本の指示線で当てる','1つの区画に、2つの記号を並べて書く','2つの公差値を足して、1つの枠にまとめて書く','どちらか一方しか指示できないので、厳しいほうを選ぶ'],'同じ形体に複数の幾何公差を指示するときは、公差記入枠を上下に重ねて書き、1本の指示線で形体に当ててよい。'],
['sym','JIS B 0021 のデータム三角記号について正しいものはどれか。',['三角形は塗りつぶしても、塗りつぶさなくてもよい','必ず白抜きにし、塗りつぶしてはならない','必ず塗りつぶし、三角形の中に文字を書く','三角形ではなく、塗りつぶした円で示す'],'データムを示す三角形は、塗りつぶしても塗りつぶさなくてもよい。データムの文字は、三角形と線でつないだ四角い枠の中に書く。'],
['sym','公差記入枠から形体へ引く指示線について、ふつうの書き方として正しいものはどれか。',['枠の左右どちらかの端から引き、矢印を形体に当てる','公差値の区画の中央から、必ず真下に引き出す','矢印を使わず、黒丸を形体の表面に当てる','データムの区画から引き出し、データムの面に当てる'],'指示線はふつう公差記入枠の左右どちらかの端から引き出し、矢印を形体（外形線・引出線、または寸法線の延長）に当てる。矢印の当て方で、表面か軸線かが変わる。'],
['sym','データムを付けるかどうかで、形状公差にも位置公差にもなる幾何特性はどれか。',['面の輪郭度','円筒度（えんとうど）','直角度（ちょっかくど）','全振れ（ぜんぶれ）'],'線・面の輪郭度は、データムがなければ形状公差、データムに姿勢だけを関連させれば姿勢公差、位置まで関連させれば位置公差になる。円筒度は常に形状公差、直角度は姿勢公差、全振れは振れ公差。'],
// --- 追加：サイズ公差・普通公差 ---
['size','JIS で、はめあい記号付きの穴 φ20H7 に包絡の条件を適用したいときの指示として正しいものはどれか。',['φ20H7 の後ろに、包絡の条件の Ⓔ を付ける','何も付けなくても、包絡の条件が適用される','φ20H7 の後ろに Ⓜ を付けて、最大実体を示す','公差記入枠を追加し、真円度を指示する'],'JIS（JIS B 0024）は独立の原則が既定なので、はめあいの穴・軸でも包絡の条件が必要なら Ⓔ を付ける。表題欄付近の注記で一括して指示する方法もある。'],
['size','ノギスやマイクロメータで2点を挟んで測った直径は、JIS B 0420-1 の考え方で何に当たるか。',['2点間サイズ（局部サイズ）','最大実体寸法（MMS）の値','当てはめた円筒（最小二乗円筒）の直径','包絡の条件で求めたサイズ'],'JIS B 0420-1（ISO 14405-1 に対応）では、特に指示がなければサイズは2点間サイズ（局部サイズ）として扱う。最小外接円筒などに当てはめたサイズは、修飾記号で指示した場合に使う。'],
// --- 追加：データム ---
['datum','軸の円筒面からデータム軸線を設定する考え方として正しいものはどれか。',['軸に外接する最小の円筒の軸線','軸に内接する最大の円筒の軸線','測定点から求めた最小二乗円の中心を結んだ線','軸の両端面の中心を結んだ線'],'軸のデータム軸線は、実際の軸に外接する最小の円筒（チャックやリングゲージで模擬）の軸線で設定する。穴の場合は、穴に内接する最大の円筒の軸線になる。'],
['datum','穴をデータム形体として検査するとき、データム軸線を設定する道具として最も適切なものはどれか。',['穴に密着する拡張マンドレル','穴より細いピン','穴の縁に当てた V ブロック','ノギスで探した穴の中心'],'穴のデータム軸線は、穴に内接する最大の円筒で設定する。検査では、穴に密着する拡張マンドレルなどで模擬する。細いピンでは、すき間の分だけ軸線が定まらない。'],
['datum','溝の幅（相対する2平面）をデータム形体にしたときのデータムとして正しいものはどれか。',['平行ブロックの中心平面','溝の片側の側面','溝の底面（2平面に直角な面）','溝幅を2点で測った位置の中点'],'相対する2平面（サイズ形体）をデータム形体にすると、データムは中心平面になる。検査では、2平面に密着させて広げた平行ブロックの中心平面で模擬する。'],
['datum','公差記入枠のデータムの順を A|B|C から B|A|C に入れ替えた場合について、正しいものはどれか。',['部品の据え方が変わり、測定結果が変わることがある','同じ3つのデータムなので、測定結果は必ず同じになる','第3次データムの扱いだけが変わり、ほかは変わらない','データムの順に合わせて、公差値が自動的に変わる'],'第1次データムが最も多くの自由度を拘束するので、順を入れ替えると部品の据え方（どの面を先に当てるか）が変わる。面どうしが完全に直角でない実際の部品では、測定結果が変わる。'],
['datum','実際の表面（凹凸のある面）からデータム平面を設定する考え方として最も適切なものはどれか。',['外側に接し、最大のすき間が最小になる平面','表面の測定点から計算で求めた最小二乗平面','表面の最も高い3点の高さを平均した水平な平面','表面から内側に 0.01 mm 入った位置の平行な平面'],'データム平面は、実際の表面の外側に接する平面のうち、表面との最大のすき間が最小になるように置く。最小二乗平面は表面に食い込むので、データムの設定には使わない。'],
['datum','データム三角記号を、寸法線から明確にずらして外形線に置いたときのデータムはどれか。',['その表面','その形体の軸線','その形体の中心平面','その形体のサイズ'],'データム三角記号を外形線や引出線（寸法線から離した位置）に置くと、表面そのものがデータム形体になる。寸法線の延長上に置くと、軸線や中心平面がデータムになる。'],
// --- 追加：形状公差 ---
['form','マイクロメータで直径を測るとどの方向でも同じ値なのに、真円度測定機では真円度が大きく出た。考えられる形として最も適切なものはどれか。',['奇数個の山をもつ等径ひずみ円（おむすび形など）','楕円（山が2つの形で、長径と短径がある）','完全な真円で、真円度測定機の誤差による','場所によって直径が違う、テーパのある円'],'奇数個の山をもつ形は、どの方向の2点間距離もほぼ同じになる（等径ひずみ円）。2点測定では見逃すので、真円度は真円度測定機（半径法）や3点法で評価する。楕円は2点測定で見つかる。'],
['form','真円度の偏差を、定義どおりに評価する方法として正しいものはどれか。',['輪郭を挟む同心2円の、半径の差の最小値','部品の外接円の直径と、内接円の直径の差','回転台の中心から測った、半径の平均値','2点で測った直径の最大値と最小値の差'],'真円度は、輪郭を挟む同心2円の半径の差が最小になるとき（最小領域）の差で評価する。測定機では最小二乗円などで近似することもあるので、どの方法で評価したかを記録する。'],
['form','定盤に置いたブロックの上面をダイヤルゲージでなぞり、最大と最小の差を読んだ。この値について正しいものはどれか。',['下面を基準にした平行度で、平面度はこれ以下','上面の平面度そのもので、傾きは含まない','上面の真直度で、1方向の曲がりだけを表す','上面の表面粗さを、ダイヤルゲージで読んだ値'],'定盤（データム）を基準になぞった値は、下面に対する平行度の評価になる。平面度は傾きを除いて評価するので、この値以下になる。平面度を求めるには、傾きを除く処理が必要。'],
['form','3次元測定機で平面度を評価するときの注意として最も適切なものはどれか。',['点の数・配置と評価方法を、あらかじめ決めておく','4点だけ測れば、平面度は正確に決まる','最小二乗平面からの最大のずれの2倍を平面度とする','データムの優先順位を決めてから座標系を作って測る'],'測定機は限られた点でしか評価できず、点が少ないと偏差を小さく見積もりやすい。点数・配置・評価方法（最小領域か最小二乗か）を決めておく。平面度はデータムを使わない。'],
['form','円筒度を評価するために必要な測定として、最も適切なものはどれか。',['複数の横断面と母線を、共通の座標のまま測る','1つの横断面だけで、真円度を詳しく測る','両端の直径を、マイクロメータの2点で測る','データム軸線のまわりに回転させて振れを測る'],'円筒度は円筒面全体を、半径の差が t の同軸2円筒で評価する。複数の断面と母線を、互いの位置関係を保ったまま測る必要がある。1つの断面だけでは真円度しか分からない。'],
['form','形状公差を評価するときの公差域の置き方として正しいものはどれか。',['向きと位置を自由に動かし、最も狭い幅で評価する','図面の水平・垂直の方向に、公差域を固定して評価する','データム平面に平行な向きに、公差域を置いて評価する','3次元測定機の座標軸の向きに合わせて評価する'],'形状公差はデータムをもたないので、公差域の向きと位置は自由にとれる。形体を挟む公差域の幅が最小になる置き方（最小領域）で評価する。'],
// --- 追加：姿勢公差 ---
['orient','板の穴の軸線に、φ 付きの直角度（データム A は板の裏面）を指示したときの公差域として正しいものはどれか。',['データム A に直角な、直径 t の円筒の中','データム A に平行な、距離 t の2平面のあいだ','データム A に直角で、1方向だけに幅 t の2平面のあいだ','データム A を中心とする、半径 t の円の中'],'φ を付けると公差域は円筒になり、その軸はデータム平面 A に直角。穴の軸線がどの方向に傾いても規制できる。φ がなければ、矢印の方向だけに幅 t をもつ2平面になる。'],
['orient','底面がデータム A のピンの直角度を、定盤とダイヤルゲージで調べる方法として最も適切なものはどれか。',['A を定盤に置き、上下になぞって変化を見る','ピンを定盤に寝かせ、直径を何か所かで測る','ピンの先端の高さだけを、ハイトゲージで1点測る','ピンを指で回しながら、ダイヤルゲージで振れを読む'],'データム A を定盤に置けば、定盤に直角な方向が基準になる。ゲージを上下に動かしたときの母線の読みの変化から傾きが分かる（軸線の直角度は、向かい合う母線や複数の方向の読みから求める）。'],
['orient','上面に平行度 0.05（データム A）と平面度 0.02 を同時に指示した。正しいものはどれか。',['平面度は平行度より小さい値でないと意味がない','平行度と平面度は同じ値にしなければならない','平面度のほうを大きい値にするのが正しい','2つを同時に指示することはできない'],'平行度の公差域に入る面は、平面度も平行度の値以内になる。平面度をさらに厳しくしたいときだけ、平行度より小さい値で追加する意味がある。'],
['orient','面に指示した傾斜度（φ なし）の公差域として正しいものはどれか。',['データムから理論的に正確な角度だけ傾いた2平面のあいだ','理論的に正確な角度から、±t 度の角度の範囲','データムに平行な、距離 t の2平行平面のあいだ','理論的に正確な角度の位置から、片側だけに t の範囲'],'傾斜度の公差は角度ではなく長さ（公差域の幅）で指示する。公差域は、データムに対して理論的に正確な角度だけ傾いた2平行平面のあいだ。'],
['orient','姿勢公差と位置公差の違いとして正しいものはどれか。',['姿勢公差は距離を規制せず、位置公差は規制する','姿勢公差は位置も規制し、位置公差は姿勢を規制しない','どちらも、データムからの距離だけを規制する公差である','記号が違うだけで、規制する内容はまったく同じ'],'姿勢公差（平行度・直角度・傾斜度）は向きだけを規制する。位置公差は、理論的に正確な寸法で決まる位置に公差域を固定するので、位置・向き・形を同時に規制する。'],
// --- 追加：位置公差 ---
['loc','JIS の図面で、「4×」で4つの穴に位置度を指示し、データムを A（裏面）だけにした。規制されるものはどれか。',['穴どうしの位置と、A に対する向き','板の外形（B・C の面）に対する穴群全体の位置','4つの穴それぞれの直径（サイズ）','板の外形の寸法と、その直角度'],'JIS B 0025:1998 の考え方では、4つの公差域どうしの位置（理論的に正確な寸法）と A に対する向きが固定され、穴群全体は A の面内で自由に動ける。板の外形に対する位置も規制したいときは B・C を加える。なお ISO 5458:2018 では、CZ を付けないと穴ごとに独立した公差域になる。','kf73866'],
['loc','位置度を指示した穴の位置を、図面に「40±0.1」のような ± 付きの寸法で書いた。問題点として正しいものはどれか。',['真位置が決まらず、公差域が二重になる','問題はなく、むしろ推奨される','位置度の公差が自動的に 0.1 増える','データムが不要になる'],'位置度の公差域の位置は、理論的に正確な寸法（枠囲み）で決める。± 付きの寸法を併用すると、どちらの公差で判定するかがあいまいになる。'],
['loc','同心度（同軸度と同じ記号を、点に使う場合）の説明として正しいものはどれか。',['断面の中心が、データム中心と同心の直径 t の円の中','軸線全体が、データム軸線と同軸の直径 t の円筒の中','表面の振れの大きさを、1回転させて規制する','半径の差が t の、同心の2円のあいだに輪郭がある'],'同心度は、ある横断面での円の中心（点）をデータムの中心（点）に対して規制する。軸線全体を規制するのは同軸度。どちらも同じ記号を使う。'],
['loc','平面に位置度を指示したときの公差域として正しいものはどれか。',['理論的な面に対称な、距離 t の2平面','データム平面から、距離 t の範囲（片側）','真位置を軸とする、直径 t の円筒の中','面から片側だけに、t の範囲をとる'],'平面に位置度を指示すると、データムと理論的に正確な寸法（と角度）で決まる理論的な面に対称な2平行平面（間隔 t）が公差域になる。位置・向き・形を同時に規制する。'],
['loc','位置度 φ0.1 の穴を、x・y それぞれ ±0.05 に入っているかどうかで判定した。この判定の問題点として正しいものはどれか。',['正方形の隅で、円の外にある不良品を合格にする','円の内側の合格品を、不合格にしてしまう','問題はなく、どちらの方法でも判定は同じになる','位置度の公差が、実質的に半分になる'],'±0.05 の正方形は直径 0.1 の円を内側に含み、隅が円の外に出る。対角方向にずれた穴は円の外でも正方形の中に入るので、不良品を合格にする。2√(Δx²＋Δy²) で判定する。'],
['loc','JIS で、溝の中心平面に指示した対称度の公差域と同じになるものはどれか。',['理論的に正確な寸法が 0 の位置度','同じ値の平行度（データムは同じ）','同じ値の平面度（データムなし）','半分の値の位置度（φ 付きで指示）'],'対称度の公差域は、データム中心平面に対称な距離 t の2平面のあいだ。これは、データム中心平面からの理論的に正確な寸法が 0 の位置度（φ なし）と同じ。ASME Y14.5-2018 では対称度を廃止し、位置度などで指示する。'],
// --- 追加：輪郭度 ---
['prof','データムを指示しない面の輪郭度について正しいものはどれか。',['形だけを規制し、公差域の位置と向きは自由','データムがなくても、位置まで規制する','公差域は、輪郭の片側だけに t をとる','輪郭の大きさ（拡大・縮小）は規制しない'],'データムのない輪郭度は形状公差で、理論的に正確な輪郭（形と大きさ）に合わせて公差域の位置と向きを自由に動かせる。輪郭の大きさは理論的な輪郭で決まるので規制される。'],
['prof','輪郭度の公差域の幅を測る方向として正しいものはどれか。',['輪郭の各点での法線方向','図面の縦方向','データム A の面に垂直な方向','3次元測定機の Z 軸の方向'],'輪郭度の公差域は、理論的に正確な輪郭の各点で、輪郭に垂直な方向（法線方向）に幅 t をもつ。球や円の包絡で定義するのはそのため。'],
['prof','線の輪郭度と面の輪郭度の違いとして正しいものはどれか。',['線は指定した断面ごと、面は面全体を規制する','線は平面だけに、面は曲面だけに使う','線はデータムが必要で、面はデータムが不要','線は位置だけを、面は形だけを規制する'],'線の輪郭度は、指示した方向の各断面の輪郭（2次元）を規制し、面の輪郭度は面全体（3次元）を規制する。押出し形状のように断面の形が問題になる場合は線の輪郭度を使う。'],
['prof','面の輪郭度 0.3（データム A・B・C）の面で、ある点の法線方向のずれが +0.12 だった。この点の判定として正しいものはどれか。',['±0.15 以内なので合格','0.3 の半分を超えるので不合格','片側の値だけでは判定できない','データムがあるので ±0.3 まで許される'],'公差域は理論的に正確な輪郭の両側に 0.15 ずつ（合計 0.3）。データムに固定されているので、各点のずれ（符号付き）が ±0.15 以内なら合格。'],
['prof','3次元測定機で輪郭度を評価するために、最も重要な情報はどれか。',['理論的に正確な輪郭の定義','輪郭の各点に付けた ± のサイズ公差','普通寸法公差（JIS B 0405）の等級','表面粗さの指示と、加工方法の指示'],'輪郭度は理論的な輪郭からのずれで評価するので、理論的な輪郭（理論的に正確な寸法や3次元モデル）が明確でなければ評価できない。データムがあれば、その順に座標系を作ってから比べる。'],
['prof','複雑な形の面に、たくさんの ± 寸法の代わりに面の輪郭度を使う利点として正しいものはどれか。',['1つの指示で、面全体の形と位置を規制できる','測定しなくても、合否が判定できるようになる','どんな形でも、加工が必ずやさしくなる','データムを指示しなくても、位置が決まる'],'面の輪郭度は、理論的な輪郭からのずれを1つの公差で規制する。たくさんの ± 寸法では、どの点をどこから測るかがあいまいになりやすい。'],
// --- 追加：振れ公差 ---
['run','端面に軸方向の円周振れを指示した。端面が円すい状にへこんでいる（どの円周上でも高さは一定）場合について正しいものはどれか。',['各円周上の変位が小さく、見つけにくい','円周振れで、必ず大きな値として現れる','円周振れの値は、へこみの深さの2倍になる','半径方向の円周振れとして、外周に現れる'],'軸方向の円周振れは、半径ごとの円周上の変位だけを見るので、どの円周上でも高さが一定の円すい状のへこみは検出しにくい。端面全体の形や向きを規制したいときは、軸方向の全振れや直角度を使う。'],
['run','半径方向の全振れが規制するものとして正しいものはどれか。',['円筒度と同軸度をまとめたもの','横断面の真円度だけ（ほかは規制しない）','直径のサイズ（2点間サイズ）だけ','端面の平面度と、直角度'],'半径方向の全振れは表面全体での振れなので、形（真円度・真直度・円筒度）と、データム軸線に対する位置・向きのずれ（同軸度・傾き）をまとめて規制する。'],
['run','両端の軸受部 A・B で支える軸の外周に、円周振れ（データム A-B）を指示した。検査で軸を支える方法として最も適切なものはどれか。',['A と B を同時に支えて回転させる','中央の外周（測る面）を V ブロックで支えて回す','両端のセンタ穴だけで支えて、A・B は使わない','A だけを V ブロックで支え、B は浮かせたまま回す'],'共通データム A-B は、2つの軸受部から作る1本の軸線。検査では A と B を同時に支えて回転させる。センタ穴で支えると、センタ穴の軸線を基準にした値になり、A-B とずれることがある。'],
['run','円すい面（テーパ面）に円周振れを指示した。振れを測る方向として、特に指示がない場合に正しいものはどれか。',['表面に垂直な方向','半径方向（軸に直角な方向）','軸方向（軸に平行な方向）','回転方向（円周の接線方向）'],'特に指示がなければ、円周振れは測る表面に垂直な方向で読む。円すい面では、半径方向でも軸方向でもなく、表面の法線方向になる。'],
['run','円周振れの検査で、ダイヤルゲージの指示値の読み方として正しいものはどれか。',['1回転のあいだの最大値と最小値の差','1回転のあいだに読んだ指示値の最大値','指示値の最大値と最小値を足して2で割った値','最初の位置（0 点）からの最大の変化量'],'振れの値は、1回転のあいだの指示値の最大と最小の差（全振幅。TIR・FIM とも呼ぶ）。0 点の位置に関係なく、差で読む。'],
['run','円周振れと同軸度の違いとして正しいものはどれか。',['振れは表面で読み、同軸度は軸線を求めて評価する','同軸度は回転させて読み、振れは回転させずに読む','円周振れは、データムを使わずに評価できる','両者は同じ公差域をもち、同じ値で評価する'],'円周振れはデータム軸線のまわりに回転させて表面の変位を読むので、現場で測りやすい。同軸度は軸線そのものを求める必要があり、真円度測定機や3次元測定機で各断面の中心を求めて評価する。'],
// --- 追加：最大実体公差方式 ---
['mmc','穴の位置度に Ⓜ を指示した部品で、穴が最小実体寸法（最大の穴径）に仕上がったときに許される位置度はどれか。',['公差値＋サイズ公差の全幅','図面の公差値のままで、増えない','サイズ公差の全幅だけ（図面の公差値は含めない）','図面の公差値の2倍'],'Ⓜ では、実寸法が最大実体寸法から離れた分だけ公差が増える。最小実体寸法では増える量が最大（サイズ公差の全幅）になり、許される位置度は「公差値＋サイズ公差の全幅」。'],
['mmc','データムの文字の後ろにも Ⓜ を付けた（例：位置度 φ0.1 Ⓜ | A | B Ⓜ）。その効果として正しいものはどれか。',['データム形体と境界のすき間の分のずれを認める','データム B の形体の公差値が、その分だけ増える','データム B の形体は、測定しなくてよくなる','穴の位置度の公差値が、自動的に2倍になる'],'データムにも最大実体公差方式を適用すると、データム形体（穴など）が境界より大きく（軸なら小さく）仕上がった分だけすき間ができ、部品のずれ（データムシフト）を認める。機能ゲージでデータム用のピンを固定径にできる。'],
['mmc','最大実体公差方式を使うのが適切でない例として、最も適切なものはどれか。',['歯車の中心距離のように位置が性能に効く場合','ボルトを通す穴の、板の上での位置','すき間ばめで組み付けるピン穴の位置','カバーをねじで留める取付け穴の位置'],'Ⓜ は、すき間で位置のずれを吸収できる組付けの要求に向く。歯車の中心距離のように位置そのものが性能に効く場合は、穴が大きくても位置のずれは許されないので、Ⓜ を付けない（サイズに無関係にする）。'],
// --- ゼロ幾何公差 ---
['zero','ゼロ幾何公差（位置度 φ0 Ⓜ）で、穴が最大実体寸法に仕上がったときに許される位置度はどれか。',['0（位置のずれを許さない）','サイズ公差の全幅（実寸法によらない）','サイズ公差の半分（実寸法によらない）','普通幾何公差の値'],'φ0 Ⓜ では、最大実体寸法のときの位置度は 0。穴が大きく仕上がるにつれて、その差の分だけ位置のずれが許される。'],
['zero','ゼロ幾何公差を使うとき、穴の最大実体寸法（サイズの下限）の決め方として正しいものはどれか。',['組付けに必要な実効寸法（境界）と同じ値にする','従来の下限より、位置度の値の分だけ大きくする','上限（最小実体寸法）と同じ値にする','普通寸法公差（JIS B 0405）の等級で決める'],'φ0 Ⓜ では、穴の最大実体寸法がそのまま実効寸法（組付けの境界）になる。従来の「MMS−t」の値を新しい下限にし、サイズ公差を位置度の分だけ広げれば、機能を変えずに書き換えられる。'],
['zero','位置度 φ0.1 Ⓜ をゼロ幾何公差（φ0 Ⓜ）に書き換える利点として正しいものはどれか。',['位置が良ければ、従来はサイズ不合格の穴も使える','位置のずれが一切許されなくなり、厳しくなる','位置度の測定が不要になり、検査が楽になる','穴の最大径を小さくでき、強度が上がる'],'書き換え後は、サイズ公差と位置度の配分を、実際の加工の出来ばえに合わせて使える。位置が良ければ、従来なら下限を下回ってサイズ不合格だった穴も合格になり、組付けには問題がない。'],
['zero','位置度に Ⓜ も Ⓛ も付けずに「φ0」と指示した場合について、最も適切なものはどれか。',['ずれを一切許さない意味になり、使えない','ゼロ幾何公差（φ0 Ⓜ）と同じ意味になる','普通幾何公差（JIS B 0419）が適用される','記入漏れとみなし、φ0.1 として扱う'],'Ⓜ・Ⓛ のない φ0 は、サイズに関係なく公差域の直径が 0 になり、どんな部品も合格にならない。ゼロ幾何公差は、Ⓜ（または Ⓛ）と組み合わせて初めて意味をもつ。'],
['zero','ゼロ幾何公差（φ0 Ⓜ）の穴を機能ゲージで検査する。ピンの直径として正しいものはどれか。',['穴の最大実体寸法と同じ直径','穴の最小実体寸法と同じ直径','最大実体寸法より 0.1 小さい直径','最小実体寸法より 0.1 小さい直径'],'実効寸法は MMS−0＝MMS なので、ピンは穴の最大実体寸法の直径で作る。このピンが入れば組み付けられる。穴の上限（最小実体寸法）は別に検査する。'],
['zero','軸（ピン）にゼロ幾何公差（φ0 Ⓜ）を適用した場合の、軸のサイズの上限について正しいものはどれか。',['相手の穴に入る境界と同じ値','従来の上限より小さくなり、軸は細くなる','上限は決めず、下限だけを指示する','位置度と無関係に、普通公差の等級で決まる'],'軸では実効寸法＝MMS＋0＝MMS。従来の「MMS＋t」の値を新しい上限（最大実体寸法）にし、サイズ公差をその分広げて書き換える。'],
// --- 測定と検査 ---
['meas','3次元測定機で穴の位置度を評価するとき、最初に行うこととして最も適切なものはどれか。',['公差記入枠の優先順位どおりに座標系を作る','測りやすい面を基準にして、座標系を作る','測定機の機械座標を、そのまま使って測る','測った穴の中心の平均を、座標の原点にする'],'位置度は、データムと理論的に正確な寸法で決まる真位置からのずれなので、データムの優先順位どおりに座標系（第1次で平面、第2次で向き、第3次で原点）を作ってから測る。順序を変えると結果が変わる。'],
['meas','3次元測定機で穴の中心や直径を求めるときの当てはめ方法（最小二乗円・最大内接円など）について正しいものはどれか。',['方法で結果が変わるので、目的に合わせて決めておく','どの当てはめ方法でも、結果は同じになる','規格で、最小二乗円を使うと決まっている','測定点を増やせば、当てはめ方法は関係なくなる'],'当てはめ方法によって、求まる中心や直径が変わる。組付けの境界に近いのは最大内接円（穴）や最小外接円（軸）、平均的な形を見るには最小二乗円。測定手順で方法を決め、測定者による違いをなくす。'],
['meas','JIS B 0680（ISO 1 に対応）で定める、幾何特性の仕様と検証に用いる標準温度はどれか。',['20 ℃','23 ℃','25 ℃','0 ℃'],'寸法や幾何特性は 20 ℃ での値として定める。温度が違うと部品と測定機の熱膨張で値が変わるので、測定室の温度管理や温度補正が必要になる。'],
['meas','ISO 14253-1（JIS B 0641-1 に対応）の考え方で、供給者が「規格に適合している」と示すときの判定範囲として正しいものはどれか。',['公差域を測定の不確かさの分だけ狭めた範囲','公差域を測定の不確かさの分だけ広げた範囲','公差域そのもの（不確かさは考えない）','測定値の平均が公差の中心に近い範囲'],'適合を示す側（供給者）は、公差域を測定の不確かさの分だけ内側に狭めた範囲に測定値があれば合格とする。不適合を示す側（受入側）は、不確かさの分だけ外側に広げた範囲を超えたときに不合格とする。'],
['meas','平面度や位置度の測定システムのばらつき（GRR）を、公差に対する比率で評価するとき、比べる公差の幅として正しいものはどれか。',['その幾何公差の値（0 から公差値）','図面の普通寸法公差（JIS B 0405）の幅','部品の直径のサイズ公差','測定機の最小表示量（分解能）の10倍'],'平面度や位置度は 0 を下限とする片側の公差なので、公差の幅は公差値そのもの。GRR は、その幾何公差の値（または工程のばらつき）と比べて評価する。サイズ公差と比べるのは誤り。'],
['meas','ハイトゲージと定盤で、穴の中心のデータム B（下面）からの高さを求める方法として正しいものはどれか。',['B を定盤に置き、上下の高さを平均する','穴の上側の母線の高さだけを、そのまま読む','部品を寝かせて、穴の深さをハイトゲージで測る','ノギスで穴の直径を測り、その半分を高さとする'],'データム B を定盤に当て、穴の上側と下側の高さを読んで平均すると、定盤（データム B）からの穴の中心の高さが分かる。片側だけでは、穴の半径の分だけずれる。'],
['meas','円周振れを V ブロックで支えて測るときの注意として正しいものはどれか。',['データム形体の形のくずれが振れの値に影響する','V ブロックは常に、理想的なデータム軸線を作る','V ブロックの角度（90°・120° など）は結果に関係しない','測る面そのものを V ブロックに載せて回す'],'V ブロックはデータム形体の表面に2線で接して軸線を模擬するので、データム形体に等径ひずみ円などのくずれがあると、回転とともに軸線が動き、振れの値に影響する。精度が必要なら両センタや精密な軸受で支える。'],
['meas','検査で、理論的なデータムの代わりに使う定盤・マンドレル・V ブロックなどを何と呼ぶか。',['実用データム形体','データムターゲット','理論的に正確な寸法','誘導形体'],'実際の検査で、理論的なデータムの代わりに使う十分に精密な形体を、実用データム形体と呼ぶ。精度はデータムの設定のばらつきとして測定結果に入る。'],
['meas','真円度測定機で、部品の中心と回転台の中心が少しずれていた（偏心）。真円度の評価について正しいものはどれか。',['小さな偏心は、計算で中心を求めるので補正される','偏心の分が、そのまま真円度の値に加わる','偏心があると、真円度測定機では測定できない','偏心量の2倍を、読んだ値から引けばよい'],'真円度は輪郭を挟む同心2円で評価し、その中心は計算で求めるので、小さな偏心は補正される。ただし偏心が大きいと測定子の追従などで誤差が増えるので、心出しをしてから測る。'],
['meas','平面度 0.05 の部品を、定盤とすきまゲージで確認した。最も適切な考え方はどれか。',['凹凸の目安にはなるが、置き方で値が変わる','すきまが 0.05 以下なら、平面度は必ず合格','すきまの値が、そのまま平行度の値になる','すきまゲージでは、平面については何も分からない'],'定盤と部品のすきまを見る方法は、凹凸の目安にはなるが、どこで接するかですきまが変わり、最小領域で評価した平面度とは一致しない。判定の根拠にするなら、測定方法と判定基準を取り決めておく。'],
['meas','3次元測定機の測定子（プローブ）について正しいものはどれか。',['先端球の半径を補正し、垂直に近く当てる','どの方向から当てても、測定結果は同じになる','先端球の半径は小さいので、補正しなくてよい','1点だけ測れば、面の向きが決まる'],'3次元測定機は先端球の中心の座標を記録するので、球の半径を補正して表面の点を求める。補正には当てた方向を使うので、表面に垂直に近い方向から当てる。'],
['meas','幾何公差の測定結果に、合否と一緒に記録すべきものとして最も重要なものはどれか。',['データム・測定点・評価方法','測定した人の名前（測定者）だけを記録する','合否の結果だけを記録すれば十分である','使った測定機のメーカー名と型式だけ'],'幾何公差の値は、データムの設定方法、測定点の数と配置、当てはめ・評価の方法で変わる。あとで再現・比較できるように、測定方法を結果と一緒に記録する。'],
// --- 検具・機能ゲージ ---
['gauge','位置度を検査する機能ゲージの利点として正しいものはどれか。',['組付けの境界を模擬し、短時間で合否を判定できる','位置度の数値（偏差の大きさ）が分かる','穴のサイズ（直径）も同時に保証できる','Ⓜ のない（サイズに無関係な）位置度にも使える'],'機能ゲージは実効寸法で作ったピンなどで組付け状態を模擬し、入るかどうかで合否を判定する。数値は分からず、サイズは別に検査する。Ⓜ を指示した場合に適している。'],
['gauge','機能ゲージのピンの製作公差の置き方として、一般的な考え方はどれか。',['製品の公差の内側に置く','製品の公差の外側に置き、良品を不合格にしない','ピンは公差なしで、実効寸法ぴったりに作れる','ピンは実効寸法より、必ず小さく作る'],'製作公差や摩耗代を製品の公差の内側（穴用のピンなら実効寸法より太い側）に置くと、ぎりぎりの良品を不合格にすることはあるが、不良品を合格にしない。どちらに置くかは、ゲージの管理規定で決めておく。'],
['gauge','穴の位置度（Ⓜ）を機能ゲージで合格としても、別に検査しなければならないものはどれか。',['穴の直径（下限と上限）','穴の位置度の数値','データムの優先順位と、その当て方','普通幾何公差の等級と、その値'],'機能ゲージは組付けの境界だけを確かめる。穴が大きすぎても入るし、位置が良ければ下限を下回る穴でも入ることがあるので、穴の直径はピンゲージや限界ゲージで別に検査する。'],
['gauge','限界ゲージの通り側で確かめるものとして正しいものはどれか。',['最大実体の側（穴なら小さすぎないか）','最小実体の側（穴なら大きすぎないか）','穴の位置度（真位置からのずれ）','穴の真円度だけ（直径は確かめない）'],'通り側は最大実体寸法で作り、形体全体に通ることで、穴なら小さすぎない、軸なら大きすぎないことを確かめる。止まり側は最小実体寸法で作り、通らないことを確かめる。'],
['gauge','テイラーの原理による限界ゲージの形として正しいものはどれか。',['通り側は完全な形、止まり側は2点で当たる形','通り側も止まり側も、2点で当たる形にする','通り側も止まり側も、完全な形（円筒）にする','通り側は2点で当たる形、止まり側は完全な形'],'テイラーの原理では、通り側は相手部品と同じ完全な形（全長にわたる円筒など）にして包絡の条件を確かめ、止まり側は局部のサイズを確かめるため2点で当たる形にする。'],
['gauge','検査治具で部品をデータムどおりに据えるための構成として、最も適切なものはどれか。',['データムどおりの受けに、順に当てる','部品を手で押さえて、任意の位置に置く','強いクランプで部品を変形させ、固定してから測る','外形に合わせた枠に入れるだけで、受けは設けない'],'検査治具は、図面のデータム（またはデータムターゲット）を模擬する受けと当て面を、優先順位どおりに配置して部品を据える。図面と違う当て方をすると、図面と違う基準で判定することになる。'],
['gauge','樹脂部品やパネルを検査治具で押さえてから測るときに、最も注意すべきことはどれか。',['図面の拘束条件の注記や Ⓕ を確かめて測る','押さえれば変形が直るので、常に強く押さえてよい','押さえる位置や力は、測定結果に影響しない','変形しやすい部品は、検査の対象から外す'],'変形しやすい部品は、押さえ方で測定値が変わる。図面に拘束条件の注記（押さえる位置・力など。JIS B 0026 の非剛性部品の考え方）や、自由状態で適用する指示（Ⓕ）があれば、それに従って測る。取り決めがなければ、仕入先と条件を合わせておく。'],
['gauge','検査治具の精度を管理する方法として最も適切なものはどれか。',['定期的に基準やピン位置を校正し、記録する','製作したときに一度確認すれば、それで十分','部品が入れば、治具は正しいとみなしてよい','治具の誤差は、製品の判定に関係しない'],'検査治具も測定器なので、摩耗や変形で基準がずれる。定期的に3次元測定機などで校正して記録し、GRR などで測定システムとしての能力も確かめる。'],
// --- 検図 ---
['chk','仕入先から届いた図面で、平面度の公差値に φ が付いていた。受入側の対応として最も適切なものはどれか。',['設計意図を確認し、図面の訂正を依頼する','φ を無視して、受入側の判断で測って判定する','円筒の公差域として解釈し、そのまま測る','平面度の検査を省略し、外観だけ確認する'],'平面度の公差域は2平行平面なので、φ は誤記と考えられる。受入側で勝手に解釈すると、仕入先と判定がずれる。設計意図を確認して、図面を訂正してもらう。'],
['chk','穴の軸線に指示するつもりの位置度の矢印が、寸法線から離れた外形線に当たっていた。問題点として正しいものはどれか。',['表面への指示になり、軸線への指示にならない','問題はなく、そのまま軸線への指示として扱われる','データム（基準）への指示として扱われる','公差値が半分の指示として扱われる'],'矢印を寸法線から離れた外形線に当てると、表面（外殻形体）への指示になる。穴の軸線に指示するなら、穴の直径の寸法線の延長上に矢印を当てる。'],
['chk','検図で、すべての穴に Ⓜ 付きの位置度が指示されていた。確認すべきこととして最も適切なものはどれか。',['位置が性能に効く穴が含まれていないか','Ⓜ は常に正しいので、特に確認する必要はない','すべての Ⓜ を、Ⓛ に変えるべきかどうか','穴の数が偶数になっているかどうか'],'Ⓜ は、組付けのすき間で位置のずれを吸収できる穴に向く。位置そのものが性能に効く穴（中心距離・はめあいの基準など）に Ⓜ が付いていると、機能を保証できない部品を合格にするおそれがある。'],
// --- 組付けと公差の積み上げ ---
['stack','公差の積み上げの最悪値法（ワーストケース）について正しいものはどれか。',['各公差を足し、全部が最悪にそろう場合を考える','各公差の二乗和の平方根をとって、合成のばらつきとする','各公差の平均値をとって、合成した公差とする','いちばん大きい公差だけを使って、全体を考える'],'最悪値法は、各要素の公差の絶対値を足し合わせる。どんな組合せでも組み付くことを保証できるが、各部品の公差は厳しくなりやすい。'],
['stack','二乗和平方根（RSS）で公差を積み上げるときの前提として正しいものはどれか。',['各要素が独立で、中心付近に正規分布でばらつく','すべての要素が、最悪の向きにそろってばらつく','積み上げる要素の数が、2つ以下である','積み上げる公差が、すべて等しい値である'],'RSS は、各要素が独立で、中心のまわりに正規分布に近い形でばらつくことを前提に、合成のばらつきを √Σt² で見積もる。工程の中心ずれや分布の偏りがあると、前提が崩れる。'],
['stack','位置度 φt（Ⓜ なし）を、1方向の寸法の積み上げに入れるときの公差として正しいものはどれか。',['±t/2','±t（φ の値をそのまま）','±2t','±t/4'],'位置度 φt の公差域は直径 t の円なので、どの方向にも真位置から最大 t/2 までずれうる。1方向の積み上げには ±t/2 として入れる。'],
['stack','最大実体公差方式を指示した穴と軸の組付けで、最悪の場合のすき間の求め方として正しいものはどれか。',['穴の実効寸法−軸の実効寸法','穴の最大実体寸法−軸の最大実体寸法','穴の最小実体寸法−軸の最小実体寸法','穴の直径の平均−軸の直径の平均'],'最悪の組合せは、穴が最も小さく位置が最もずれた状態（穴の実効寸法）と、軸が最も太く位置が最もずれた状態（軸の実効寸法）。その差が 0 以上なら、どの組合せでも組み付く。'],
['stack','RSS で決めた公差で量産したとき、組付け不良が起こりうる理由として正しいものはどれか。',['中心ずれや偏りで、見積もりより悪くなる','RSS は、最悪値法より常に厳しい計算になるから','RSS で決めれば、組付け不良は必ず 0 になるから','要素の数が多いほど、RSS は必ず不正確になるから'],'RSS は確率的な見積もりで、まれな組付け不良を許容している。さらに工程の中心ずれや分布の偏りがあると、見積もりより悪くなる。重要な特性は、工程能力で前提を確かめる。'],
// --- 複数段の公差記入枠 ---
['multi','ASME Y14.5 の複合位置度（記号を1つにした2段の枠）で、上段の役割として正しいものはどれか。',['パターン全体をデータムに対して位置決めする','穴どうしの間隔だけを、下段よりさらに厳しく規制する','穴の直径（サイズ）を、上下2段で規制する','データム形体の形を、上段で規制する'],'上段（パターンを位置決めする公差域の枠組み）は、穴のパターン全体を、データムと理論的に正確な寸法に対して位置決めする。下段は、穴どうしの位置関係と向きを、より厳しく規制する。'],
['multi','ASME の複合位置度の下段にデータム A・B を書いたとき、下段のデータムが規制するものとして正しいものはどれか。',['データムに対する向きだけ（位置は規制しない）','データムに対する位置と向きの両方を規制する','何も規制せず、参考として書くだけ','データム形体の形と大きさを規制する'],'複合位置度の下段のデータムは、穴のパターンの向き（データムに対する傾き・回転）だけを規制し、データムからの位置（平行移動）は規制しない。位置は上段で規制する。'],
['multi','ASME の複合位置度で、下段に書くデータムの決まりとして正しいものはどれか。',['上段と同じ順で、上段のデータムを繰り返す','上段と逆の優先順位で、下段にデータムを書く','上段にないデータムを、下段に追加してよい','下段には、データムを書いてはならない'],'複合位置度の下段のデータムは、上段のデータムを同じ優先順位で（上段の左から順に）繰り返す。順序を変えたり、上段にないデータムを書いたりはしない。'],

{id:'d06',cat:'zero',title:'ゼロ幾何公差への書き換え',fig:['fcf',{sym:'pos',tol:'φ0.1(M)',dats:['A','B','C']}],

 opts:['φ0 Ⓜ','φ0','φ0.1 Ⓜ','φ9.9 +0.3/0','φ10 +0.3/0','φ9.9 +0.2/0','φ9.9','φ10.0','φ0.05','φ0.15','サイズで不合格','合格'],ans:[0,3,6,8,10],

{id:'d07',cat:'meas',type:'ox',title:'測定方法の正誤',
 stem:'次の文が正しければ○、誤りなら×を選べ。',

  ['定盤に部品の下面を置き、上面をダイヤルゲージでなぞった最大と最小の差は、下面をデータムとする平行度の評価になる。',true,'定盤がデータムを模擬するので、上面の指示値の最大と最小の差は平行度の評価になる。',],
  ['同じ方法で読んだ値は、上面の平面度としてそのまま使ってよい。',false,'読んだ値には上面の傾きが含まれる。平面度は傾きを除いて評価するので、この値以下になる。'],
  ['穴の位置度は、3次元測定機で求めた中心座標と、理論的に正確な寸法の差から 2√(Δx²＋Δy²) で求める。',true,'データムの順に座標系を作り、真位置とのずれから直径で表した偏差を求める。'],
  ['3次元測定機では、データムの優先順位に関係なく、測りやすい面から座標系を作ってよい。',false,'優先順位を変えると部品の据え方が変わり、結果も変わる。公差記入枠の順に座標系を作る。'],
  ['マイクロメータで直径を何か所か測っても、奇数個の山をもつ形の真円度のくずれは見つけられないことがある。',true,'等径ひずみ円はどの方向の2点間距離もほぼ同じなので、2点測定では見逃す。'],
  ['Ⓜ のない（サイズに無関係な）位置度は、固定ピンの機能ゲージだけで合否を判定できる。',false,'固定ピンの機能ゲージは、実寸法に応じて公差が増える Ⓜ の考え方に合わせたもの。サイズに無関係な位置度は、3次元測定機などで位置そのものを測る。','gauge'],
 ]},

 opts:['φ7.9','φ8.0','φ8.1','φ7.85','理論的に正確な寸法','穴の実測値の平均','データムの優先順位どおりの順','測りやすい面の順','直径（サイズ）','位置','ピンゲージや限界ゲージ','同じ機能ゲージ'],ans:[0,4,6,8,10],

 opts:['0.1','0.2','0.05','合格','不合格','最大と最小の差','絶対値の最大','平均'],ans:[0,4,5,3],

{id:'c01',cat:'meas',figTop:true,title:'ケース：成績書の判定を確かめる',fig:['report',{cols:['No','項目','図面の指示','測定値','判定'],w:[22,74,90,98,30],rows:[['1','穴径','φ10 +0.2/0','φ10.12','合'],['2','穴の位置度','φ0.1(M) A|B|C','X+0.04 Y−0.05','否'],['3','上面の平面度','0.05','0.06','合'],['4','上面の平行度','0.08 A','0.07','合']],cap:'仕入先の初回品の検査成績書（抜粋）。X・Y は真位置からのずれ'}],
 stem:'仕入先から届いた初回品の検査成績書を確認する。\nNo.2 の位置度の偏差は {1} で、Ⓜ のボーナスを含めて許される位置度は {2} なので、No.2 の正しい判定は {3} である。No.3 の判定は {4}。この部品の結論は {5}。',
 opts:['φ0.128','φ0.090','φ0.064','φ0.10','φ0.22','φ0.12','合格','不合格','誤り（正しくは不合格）','正しい','不合格（No.3 が公差外）','合格（不合格は No.2 だけで、それも誤判定）'],ans:[0,4,6,8,10],
 ex:['位置度の偏差は 2√(Δx²＋Δy²)＝2√(0.04²＋0.05²)＝2×0.064＝φ0.128。X と Y を足した 0.09 や、2倍しない 0.064 は誤り。','穴の実寸法 φ10.12 は最大実体寸法 φ10.0 から 0.12 離れているので、0.1＋0.12＝φ0.22 まで許される。ボーナスの根拠は、厳密には穴に内接する最大の円筒の直径（はめあいの実寸法）で、2点測定の値以下になる。成績書には、どの方法で穴径を測ったかも書かせる。','φ0.128 ≦ φ0.22 なので合格。Ⓜ を見落として φ0.1 と比べると、不合格と誤判定する。','平面度 0.06 は公差 0.05 を超えているので、「合」は誤り。','No.3 が公差外なので部品は不合格。No.4 の平行度 0.07 は公差内だが、平行度が合格でも平面度は別に満たす必要がある（No.3 の公差のほうが厳しい）。']},
{id:'c02',cat:'meas',type:'ox',title:'ケース：成績書の記録（正誤）',
 stem:'仕入先の初回品の検査成績書（寸法測定結果）を受け取った。確認の観点として、次の文が正しければ○、誤りなら×を選べ。',
 items:[
  ['位置度の欄に X・Y のずれだけを書いて判定しているときは、位置度の偏差（2√(Δx²＋Δy²)）と、Ⓜ があれば穴の実寸法も記録させる。',true,'ずれだけでは判定の根拠が追えない。Ⓜ 付きなら、ボーナスの根拠になる実寸法も必要。'],
  ['3次元測定機でデータム系をどの面でどう作ったかは、測定者に任せてよいので記録しなくてよい。',false,'データムの設定（当てる面・測定点・順序）で結果が変わる。図面のデータムと同じ順で作ったかを記録・確認する。'],
  ['成績書に測定機の名前が書いてあれば、校正の有効期限を確かめる必要はない。',false,'校正の有効期限と、国家標準へのトレーサビリティを確かめる（IATF 16949 の 7.1.5 の要求）。'],
  ['初回品の寸法測定では、図面のすべての寸法・幾何公差に番号（バルーン）を付け、成績書の番号と対応させる。',true,'PPAP の寸法測定結果は、図面のすべての特性を対象にする。番号で対応させると、測り漏れが分かる。'],
  ['精密な寸法の測定値は 20 ℃ での値として扱うのが原則なので、測定室の温度も記録させる。',true,'JIS B 0680 の標準温度は 20 ℃。温度がずれると、熱膨張で測定値が変わる。'],
 ]},
{id:'c03',cat:'prof',figTop:true,title:'ケース：検査治具での面の輪郭度',fig:['report',{cols:['点','偏差','点','偏差'],w:[40,70,40,70],rows:[['P1','+0.6','P4','−0.5'],['P2','−0.3','P5','+0.2'],['P3','+0.9','P6','−0.4']],cap:'理想面（CAD）からの偏差。＋は外側'}],
 stem:'外装部品を検査治具に載せ、データム A・B・C の当て位置で受けて、測定点 P1〜P6 で理想面からの偏差を測った。図面の指示は面の輪郭度 1.5（データム A｜B｜C、公差域は理想面に対して両側均等）。\n公差域は理想面から両側に {1} ずつで、公差外の測定点は {2}、この部品は {3}。もしデータムを書かない面の輪郭度なら、部品を理想面に合わせ直して評価できるので、偏差の {4} が判定の目安になり、この結果では {5}。',
 opts:['0.75','1.5','0.375','P3','P1 と P3','P3 と P4','不合格','合格','最大−最小','最大値','合格の範囲（1.4 ≦ 1.5）','不合格（1.6 ＞ 1.5）'],ans:[0,3,6,8,10],
 ex:['両側均等なので、公差値 1.5 の半分の ±0.75。','+0.9 の P3 だけが ±0.75 の外。P1 の +0.6 と P4 の −0.5 は内側。','データムで位置を固定しているので、合わせ直さずに各点を ±0.75 と比べる。1点でも外なら不合格。','データムがなければ形だけを規制するので、全体をずらして合わせてよい。同じ量をずらしても形は変わらないので、偏差の幅（最大−最小）が目安になる（厳密には、3次元測定機で最適に合わせて評価する）。','最大 +0.9、最小 −0.5 で幅は 1.4。形だけなら合格の範囲だが、データムで位置を固定すると不合格。車体との段差・すき間を保証するには、データム付きの指示が要る。']},
{id:'c04',chk:true,cat:'chk',title:'ケース：寸法公差だけのピン',
 stem:'φ20 h7（0／−0.021）のピンを、相手部品の穴 φ20 H7 に挿入する。図面は JIS B 0024（独立の原則）を適用し、直径の寸法公差だけで、幾何公差も Ⓔ も書いていない。\n直径を2点測定ですべて合格にしたピンでも、{1} は不良として検出できない。独立の原則では、サイズ公差が {2} からである。挿入性を保証するには、直径の公差に {3} を付けるか、{4} を指示する。ASME Y14.5 の図面なら、指示がなくても {5} によって同じ要求になる。',
 opts:['曲がったピン','直径が小さすぎるピン','2点間サイズ（局部実寸法）だけを規制し、形は規制しない','形と位置も規制する','Ⓔ（包絡の条件）','Ⓜ','軸線の真直度 φ0 Ⓜ（ゼロ幾何公差）','平面度','Rule #1（包絡の原則）','Rule #2'],ans:[0,2,4,6,8],
 ex:['曲がっていても、どの断面の2点間の距離も公差内なら、寸法としては合格になる。','独立の原則では、サイズ公差と幾何公差は別々に満たす。サイズ公差は形（曲がり）を規制しない。','Ⓔ を付けると、最大実体寸法 φ20.000 の完全な円筒を超えてはならなくなり、曲がりも抑えられる。','軸線の真直度で曲がりを直接規制してもよい。ただし実効寸法（MMS＋t）が相手の穴の最大実体寸法 φ20.000 を超えると、H7/h7 は最小すき間が 0 なので入らない場合が出る。そのため φ0 Ⓜ（実効寸法 φ20.000）にする。穴側も同じように形を規制しておく。平面度は円筒には使えない。','ASME は Rule #1 が既定なので、サイズ形体は最大実体寸法の完全形状の境界を超えない。JIS と ASME で、同じ図面の意味が変わる例。']},
{id:'c05',chk:true,cat:'chk',figTop:true,title:'ケース：データムのない位置度',fig:['pattern',{noted:true,fcf:{sym:'pos',tol:'φ0.2',dats:[]}}],
 stem:'4つの穴で相手部品にボルト締めするブラケット。穴のパターンは外形の下面 B・左面 C に合わせて位置決めする必要があるのに、図面は位置度 φ0.2 だけで、データムを書いていない。\nこの指示で規制されるのは {1} で、{2} は規制されない。直すには、公差記入枠に {3} を書き、穴の位置を決める寸法を {4} にする。',
 opts:['4つの穴どうしの位置関係','外形（B・C）に対するパターンの位置','穴の直径','A｜B｜C のデータム','A だけのデータム','枠で囲んだ理論的に正確な寸法','± 付きの寸法','穴の深さ'],ans:[0,1,3,5],
 ex:['データムのない位置度は、穴どうしの関係（パターンの形）だけを規制する（JIS B 0025 の考え方。ISO 5458:2018 では、パターンとしてまとめるなら CZ を明記する）。','パターン全体が外形に対してずれていても、穴どうしが正しければ合格になってしまう。','裏面 A で向きを、B・C で位置を決める A｜B｜C を書く。データムの順は組付けで当たる順に合わせる。','図の 30・25 などの ± のない寸法は、普通公差がかかる寸法として読まれる。外形から穴までの寸法と穴の間隔を、枠で囲んだ理論的に正確な寸法にする。']},
{id:'c06',chk:true,cat:'chk',title:'ケース：意匠面の輪郭度にデータムがない',fig:['fcf',{sym:'sprof',tol:'1.5',dats:[],cap:'意匠面に指示した公差記入枠'}],
 stem:'エアロ部品（外装の意匠面）の図面に、面の輪郭度 1.5 だけを指示し、データムを書いていない。車体に付けたときの段差・すき間の不良が、市場で見つかった。\nこの指示が規制しているのは面の {1} だけで、車体の取付点に対する {2} は規制していない。直すには、取付点（クリップ・ボルトの座）を {3} として指定し、{4}。検査治具は {5}。',
 opts:['形','位置と姿勢','色と光沢','データム（データムターゲット）','重心','公差記入枠にデータム A｜B｜C を書く','公差値を 0.5 に厳しくする','データムターゲットと同じ位置で部品を受ける','部品のいちばん平らな面で受ける'],ans:[0,1,3,5,7],
 ex:['データムのない輪郭度は、形だけを規制する（合わせ直して評価できる）。','取付点に対する位置・姿勢は規制しないので、形がよくても車体からずれて付けば段差・すき間が出る。','樹脂の大きな外装部品は、面全体ではなく取付点の位置をデータムターゲットとして指定する。','データムを書けば、形と位置・姿勢をまとめて規制できる。公差値を厳しくしても、データムがなければ位置は規制されない。','治具の受けが図面のデータムターゲットと違うと、図面と別の基準で測ることになり、合否が図面と一致しない。']},

{id:'m01',type:'fcf',cat:'multi',title:'複合位置度（ASME）を組み立てる',fig:['pattern',{nofcf:true}],composite:true,rows:[[0,1,2,3,4],[5,6]],
 stem:'4つの穴のパターン全体は、データム A・B・C に対して直径 0.5 の公差域で位置決めできればよい。穴どうしの位置関係と裏面 A に対する直角は、直径 0.1 の公差域で厳しく規制したい。どちらも、穴が大きく仕上がった分だけ公差を増やしてよい。ASME Y14.5 の複合位置度（記号は1つで2段にまたがる）で組み立てよ。',
 opts:['@pos','@coax','φ0.5(M)','φ0.1(M)','φ0.5','A','B','C','—'],ans:[0,2,5,6,7,3,5],
 ex:['位置度の記号を1つ書き、上下の段にまたがせる。','上段はパターン全体の位置決めなので φ0.5 Ⓜ。','上段の第1次データム A。','上段の第2次データム B。','上段の第3次データム C。','下段は穴どうしの関係を厳しく規制するので φ0.1 Ⓜ（上段より小さい値）。','下段のデータム A は、パターンの A に対する向き（直角）だけを規制する。B・C を書かないので、外形に対する位置と回転は上段だけで決まる。']},
{id:'m02',type:'fcf',cat:'multi',title:'複合位置度（下段で回転も規制）',fig:['pattern',{nofcf:true}],composite:true,rows:[[0,1,2,3,4],[5,6,7]],

// ===== 図（SVG）：公差記入枠・データム記号・部品図・公差域 =====
// 問題文の図は問題データの fig（['図の名前', {引数}]）で指定し、figQ() で描く。解説の図は figFor() が言葉から選ぶ。
// 図はすべてこのアプリ用に描き起こしたもので、規格票の図を写したものではない。色はテーマの色（CSS 変数）に従う。

// --- 幾何特性の記号（20×20 の枠に描く） ---
const SYMP={
  str:'<path d="M3 10H17"/>',
  flat:'<path d="M7 6H17L13 14H3Z"/>',

};
// 記号の名前と分類（早見表・問題で使う）
const SYMN={str:'真直度',flat:'平面度',circ:'真円度',cyl:'円筒度',lprof:'線の輪郭度',sprof:'面の輪郭度',par:'平行度',perp:'直角度',ang:'傾斜度',pos:'位置度',coax:'同軸度・同心度',sym:'対称度',run:'円周振れ',trun:'全振れ'};
const symG=(k,x,y,s=20)=>`<g class="g-sym" transform="translate(${x} ${y}) scale(${s/20})">${SYMP[k]}</g>`;
const symSVG=k=>`<svg viewBox="0 0 20 20" role="img" aria-label="${SYMN[k]||k}">${symG(k,0,0)}</svg>`;

// --- 文字幅の目安（11px） ---
const tw=(t,fs=11)=>[...String(t)].reduce((a,c)=>a+(/[0-9A-Za-z+\-.,()−±]/.test(c)?(c==='.'||c===','?0.32:0.6):c==='φ'?0.7:1)*fs,0);
// 丸囲みの付加記号（Ⓜ など）
const modG=(L,x,y,r=6.2)=>`<circle class="g-sym" cx="${x}" cy="${y}" r="${r}"/><text class="g-t" x="${x}" y="${y+3.6}" text-anchor="middle" style="font-size:${r*1.45}px">${L}</text>`;
// 「φ0.1(M)」のような文字列を描く。(M)(L)(P)(E)(F) は丸囲みの記号にする。戻り値は {svg, w}
function txtG(t,x,y,cls='g-t'){
  let svg='',cx=x;
  for(const part of String(t).split(/(\([MLPEF]\))/)){if(!part)continue;
    const m=part.match(/^\(([MLPEF])\)$/);
    if(m){svg+=modG(m[1],cx+7,y-4);cx+=15;}
    else{svg+=`<text class="${cls}" x="${cx}" y="${y}">${esc(part)}</text>`;cx+=tw(part);}}
  return{svg,w:cx-x};
}
// --- 公差記入枠：o={sym, tol, dats:[], h} 左上 (x,y)。戻り値 {svg, w, h} ---
function fcfG(o,x,y,noSym){
  const h=o.h||22;let cx=x,svg='';
  const box=w=>{svg+=`<rect class="g-fcf" x="${cx}" y="${y}" width="${w}" height="${h}"/>`;};
  if(!noSym){box(h);svg+=symG(o.sym,cx+2,y+1,h-2);}cx+=h;
  const tt=txtG(o.tol,0,0),tw1=Math.max(30,tt.w+12);box(tw1);svg+=txtG(o.tol,cx+6,y+h/2+4).svg;cx+=tw1;
  for(const d of o.dats||[]){const dt=txtG(d,0,0),w=Math.max(22,dt.w+12);box(w);svg+=txtG(d,cx+(w-dt.w)/2,y+h/2+4).svg;cx+=w;}
  return{svg,w:cx-x,h};
}
// 複数段の公差記入枠。composite は記号を1つにして全段にまたがせる（ASME の複合位置度など）。
// そうでなければ、段ごとに記号をもつ単一の枠を上下に重ねる
function fcfMulti(o,x,y){
  if(!o.rows)return fcfG(o,x,y);
  const h=o.h||22;let svg='',W=0;
  if(o.composite){
    const n=o.rows.length;svg+=`<rect class="g-fcf" x="${x}" y="${y}" width="${h}" height="${h*n}"/>`+symG(o.rows[0].sym||o.sym,x+2,y+(h*n-h)/2+1,h-2);
    o.rows.forEach((r,i)=>{const f=fcfG({tol:r.tol,dats:r.dats,h},x,y+i*h,true);svg+=f.svg;W=Math.max(W,f.w);});
  }else{
    o.rows.forEach((r,i)=>{const f=fcfG({sym:r.sym,tol:r.tol,dats:r.dats,h},x,y+i*h);svg+=f.svg;W=Math.max(W,f.w);});
  }
  return{svg,w:W,h:h*o.rows.length};
}
// --- 矢印・線・寸法 ---
function arrowG(x1,y1,x2,y2,cls='g-arwi',L=7,W=2.6){
  const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,bx=x2-ux*L,by=y2-uy*L;
  return `<path class="g-thin" style="stroke:var(--ink)" d="M${x1} ${y1}L${bx} ${by}"/><path class="${cls}" d="M${x2} ${y2}L${bx-uy*W} ${by+ux*W}L${bx+uy*W} ${by-ux*W}Z"/>`;
}
// 指示線：公差記入枠の端 (x1,y1) から折れ点 (xm,ym) を経て矢印 (x2,y2)
const leadG=(x1,y1,xm,ym,x2,y2)=>`<path class="g-thin" style="stroke:var(--ink)" d="M${x1} ${y1}L${xm} ${ym}"/>`+arrowG(xm,ym,x2,y2);
// 寸法線（水平）：x1〜x2、高さ y、引出線は y0 から。ted=true で理論的に正確な寸法（枠囲み）
function dimH(x1,x2,y,t,o={}){
  const a=(xa,xb)=>arrowG(xa,y,xb,y,'g-arw',6,2.2);
  let s='';if(o.y0!=null)s+=`<path class="g-thin" d="M${x1} ${o.y0}V${y+(y>o.y0?3:-3)}M${x2} ${o.y0}V${y+(y>o.y0?3:-3)}"/>`;
  s+=`<path class="g-thin" d="M${x1+6} ${y}H${x2-6}"/>`+a((x1+x2)/2,x1)+a((x1+x2)/2,x2);
  const w=tw(t),cx=(x1+x2)/2;
  if(o.ted)s+=`<rect class="g-fcf" x="${cx-w/2-3}" y="${y-15}" width="${w+6}" height="13"/>`;
  return s+`<text class="g-t" x="${cx}" y="${y-4.5}" text-anchor="middle">${esc(t)}</text>`;
}
function dimV(y1,y2,x,t,o={}){
  const a=(ya,yb)=>arrowG(x,ya,x,yb,'g-arw',6,2.2);
  let s='';if(o.x0!=null)s+=`<path class="g-thin" d="M${o.x0} ${y1}H${x+(x>o.x0?3:-3)}M${o.x0} ${y2}H${x+(x>o.x0?3:-3)}"/>`;
  s+=`<path class="g-thin" d="M${x} ${y1+6}V${y2-6}"/>`+a((y1+y2)/2,y1)+a((y1+y2)/2,y2);
  const w=tw(t),cy=(y1+y2)/2;
  const tr=`transform="rotate(-90 ${x-4.5} ${cy})"`;
  if(o.ted)s+=`<rect class="g-fcf" x="${x-4.5-w/2-3}" y="${cy-10}" width="${w+6}" height="13" ${tr}/>`;
  return s+`<text class="g-t" x="${x-4.5}" y="${cy}" text-anchor="middle" ${tr}>${esc(t)}</text>`;
}
// データム記号：三角形の底辺の中点 (x,y)、枠は dir 方向（'d' 下,'u' 上,'l' 左,'r' 右）に出す
function datG(L,x,y,dir='d',len=16){
  const v={d:[0,1],u:[0,-1],l:[-1,0],r:[1,0]}[dir],n=[-v[1],v[0]],tx=x+v[0]*7,ty=y+v[1]*7;
  const tri=`<path class="g-dat" d="M${x+n[0]*5} ${y+n[1]*5}L${x-n[0]*5} ${y-n[1]*5}L${tx} ${ty}Z"/>`;
  const bx=x+v[0]*(7+len),by=y+v[1]*(7+len),S=18,rx=bx-S/2+v[0]*S/2,ry=by-S/2+v[1]*S/2;
  return tri+`<path class="g-thin" style="stroke:var(--ink)" d="M${tx} ${ty}L${bx} ${by}"/><rect class="g-fcf" x="${rx}" y="${ry}" width="${S}" height="${S}"/><text class="g-tb" x="${rx+S/2}" y="${ry+S/2+4.2}" text-anchor="middle">${L}</text>`;
}

// ===== 問題用の図 =====
const FIG={
 // 公差記入枠だけを大きく表示する。o={sym,tol,dats,labels:true（区画に番号をふる）}
 fcf(o){const sc=o.rows?1.3:1.5,f=fcfMulti(o,0,0),W=f.w*sc,x=(320-W)/2,y=16;
  let s=`<g transform="translate(${x} ${y}) scale(${sc})">${f.svg}</g>`;
  if(o.labels){const xs=[];let cx=0;const h=f.h;xs.push(cx+h/2);cx+=h;const t=txtG(o.tol,0,0);const w1=Math.max(30,t.w+12);xs.push(cx+w1/2);cx+=w1;
    for(const d of o.dats||[]){const w=Math.max(22,txtG(d,0,0).w+12);xs.push(cx+w/2);cx+=w;}
    s+=xs.map((v,i)=>`<text class="g-tr" x="${x+v*sc}" y="${y+f.h*sc+16}" text-anchor="middle">${'①②③④⑤'[i]}</text>`).join('');}
  return{svg:s,vb:`0 0 320 ${Math.round(f.h*sc+(o.labels?46:32))}`,cap:o.cap||'公差記入枠'};},

 // 板の穴の位置度：正面図（データム B・C は側面）と右側面図（データム A は裏面）
 // o={d:'φ10', tol:'+0.2/0', fcf:{sym,tol,dats}, tx, ty（理論的に正確な寸法）, n:穴の数(1|2)}
 plate(o){
  const X0=46,Y0=60,W=150,H=100,sx=X0+W+40,T=14,tx=o.tx||40,ty=o.ty||30,S=W/100;
  const hx=X0+tx*S,hy=Y0+H-ty*S,r=o.r||9;
  let s=`<rect class="g-objf" x="${X0}" y="${Y0}" width="${W}" height="${H}"/>`;
  s+=`<circle class="g-obj" cx="${hx}" cy="${hy}" r="${r}"/><path class="g-ctr" d="M${hx-r-6} ${hy}H${hx+r+6}M${hx} ${hy-r-6}V${hy+r+6}"/>`;
  // 側面図
  s+=`<rect class="g-objf" x="${sx}" y="${Y0}" width="${T}" height="${H}"/><path class="g-hid" d="M${sx} ${hy-r}H${sx+T}M${sx} ${hy+r}H${sx+T}"/><path class="g-ctr" d="M${sx-5} ${hy}H${sx+T+5}"/>`;
  // 理論的に正確な寸法（データム C：左端面から x、データム B：下端面から y）
  s+=dimH(X0,hx,Y0+H+18,o.pm?`${tx}±${o.pm}`:String(tx),{y0:Y0+H,ted:!o.pm});
  s+=dimV(hy,Y0+H,X0-16,o.pm?`${ty}±${o.pm}`:String(ty),{x0:X0,ted:!o.pm});
  // データム記号
  s+=datG(o.dB||'B',X0+W*0.78,Y0+H,'d',10);s+=datG(o.dC||'C',X0,Y0+H*0.28,'l',8);s+=datG(o.dA||'A',sx+T,Y0+H*0.8,'r',8);
  // 穴の寸法と公差記入枠
  const fx=hx+26,fy=14,lab=`${o.n>1?o.n+'×':''}${o.d||'φ10'} ${o.tol||'+0.2/0'}`;
  s+=`<text class="g-t" x="${fx}" y="${fy}">${esc(lab)}</text>`;
  if(o.nofcf)s+=`<path class="g-thin" style="stroke:var(--ink)" d="M${fx-2} ${fy+4}L${fx-8} ${fy+4}"/>`+arrowG(fx-8,fy+4,hx+r*0.72,hy-r*0.72);
  else{const f=fcfG(o.fcf||{sym:'pos',tol:'φ0.2',dats:['A','B','C']},fx,fy+5);s+=f.svg+leadG(fx,fy+16,fx-8,fy+16,hx+r*0.72,hy-r*0.72);}
  return{svg:s,vb:`0 0 320 ${Y0+H+46}`,cap:o.cap||'板の穴の位置度（左：正面図、右：右側面図）'};},

 // 直方体：データム A は下面。o={face:'top'|'side', fcf, zone:true（公差域を表示）, flat:false}
 block(o){
  const X0=o.face==='side'?34:60,Y0=40,W=o.face==='side'?150:170,H=70;let s=`<rect class="g-objf" x="${X0}" y="${Y0}" width="${W}" height="${H}"/>`;

 // 段付き軸：左の大径部の軸線がデータム A、右の小径部に公差を指示。o={fcf, onAxis:true（矢印を寸法線の延長上に置く）, dl:'φ40', dr:'φ20'}
 shaft(o){

  const dx1=70;s+=`<path class="g-thin" d="M${dx1} ${y-R1}V${y+R1}"/>`+arrowG(dx1,y,dx1,y-R1,'g-arw',6,2.2)+arrowG(dx1,y,dx1,y+R1,'g-arw',6,2.2)+`<text class="g-t" x="${dx1-4}" y="${y-6}" text-anchor="end">${esc(o.dl||'φ40')}</text>`;
  s+=datG('A',dx1,y+R1,'d',8);
  const dx2=200;s+=`<path class="g-thin" d="M${dx2} ${y-R2}V${y+R2}"/>`+arrowG(dx2,y,dx2,y-R2,'g-arw',6,2.2)+arrowG(dx2,y,dx2,y+R2,'g-arw',6,2.2)+`<text class="g-t" x="${dx2+4}" y="${y+14}">${esc(o.dr||'φ20')}</text>`;
  if(o.nofcf)s+=`<text class="g-tr" x="${dx2}" y="${y-R2-10}" text-anchor="middle">▼ この形体</text>`;
  else{const f=o.fcf||{sym:'run',tol:'0.03',dats:['A']},F=fcfG(f,o.onAxis===false?176:150,10);s+=F.svg;

 // 両端の軸受部 A・B（共通データム A-B）と、中央の大径部。o={nofcf, fcf, mark:'中央の外周'}
 shaft2(o){
  const y=76,J=17,M=32,xa=[26,92],xm=[92,214],xb=[214,282];let s='';

 // 溝付きのブロック（上から見た図）。データム A は外側の幅の中心平面。o={nofcf, fcf}
 slot(o){

 // 曲面をもつ部品：理論的に正確な寸法で輪郭を定める。o={nofcf, fcf}
 curve(o){

 // 4つの穴のパターン（データム A は裏面、B は下面、C は左面）。o={fcf（rows・composite も可）, nofcf}
 pattern(o){
  const X0=44,Y0=o.nofcf?34:(o.fcf&&o.fcf.rows?82:62),S=1.25,W=160*S,H=100*S,r=7;let s=`<rect class="g-objf" x="${X0}" y="${Y0}" width="${W}" height="${H}"/>`;

 // 測定値の並び（判定問題用）。o={vals:[], band:[下,上]（答え合わせで重ねる公差域）, base:0 の線の名前, unit}
 readings(o){

  if(o.band){const [lo,hi]=o.band;s+=`<rect class="g-zone" x="${X0}" y="${Y(hi)}" width="${X1-X0}" height="${Y(lo)-Y(hi)}"/><text class="g-tr" x="${X0+2}" y="${Y(hi)-3}">上限 ${(hi>=0?'+':'')+(+hi).toFixed(3)}</text><text class="g-tr" x="${X0+2}" y="${Y(lo)+11}">下限 ${(lo>=0?'+':'')+(+lo).toFixed(3)}</text>`;}
  s+=`<polyline class="f-line thin" points="${v.map((x,i)=>`${X(i)},${Y(x)}`).join(' ')}"/>`;
  v.forEach((x,i)=>{const out=o.band&&(x<o.band[0]-1e-9||x>o.band[1]+1e-9);s+=`<circle cx="${X(i)}" cy="${Y(x)}" r="3.6" style="fill:var(--${out?'ucl':'pri'})"/><text class="g-ts" x="${X(i)}" y="${Y(x)+(x>=0?-8:15)}" text-anchor="middle">${(x>=0?'+':'')+x.toFixed(3)}</text>`;});
  return{svg:s,vb:'0 0 320 164',cap:o.cap||'測定した値'};},
 // 振れの指示値を、データム軸線のまわりに極座標で描く（判定問題用）。o={vals:[]（等間隔）, band:[下,上]}
 polar(o){
  const v=o.vals,n=v.length,C=[160,84],R0=46,mx=Math.max(...v.map(Math.abs),o.band?Math.max(...o.band.map(Math.abs)):0)*1.3||0.05,K=26/mx,P=(x,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R0+x*K;return[C[0]+r*Math.cos(a),C[1]+r*Math.sin(a)];};
  let s=`<circle class="g-ctr" cx="${C[0]}" cy="${C[1]}" r="${R0}" style="fill:none"/><path class="g-ctr" d="M${C[0]-80} ${C[1]}H${C[0]+80}M${C[0]} ${C[1]-80}V${C[1]+80}"/>`;

 // 検査成績書（測定結果の表）。o={cols:[見出し], w:[列幅], rows:[[セル]], mark:[強調する行の番号], cap}

  const row=(cells,yy,h,head)=>{let x=X0;cells.forEach((c,i)=>{s+=`<rect class="g-fcf" x="${x}" y="${yy}" width="${W[i]}" height="${h}"${head?' style="fill:var(--surf2)"':''}/>`;
    const t=txtG(c,0,0);const tx=i===0||String(c).length<=3?x+(W[i]-t.w)/2:x+4;s+=txtG(c,tx,yy+h/2+4,head?'g-tb':'g-t').svg;x+=W[i];});};
  row(o.cols,y,HH,true);y+=HH;
  o.rows.forEach((r,i)=>{if((o.mark||[]).includes(i))s+=`<rect x="${X0}" y="${y}" width="${W.reduce((a,b)=>a+b,0)}" height="${RH}" style="fill:var(--accent-soft)"/>`;row(r,y,RH);y+=RH;});

 // 指示線の位置の比較：ア＝寸法線の延長上、イ＝寸法線からずらす
 leader(o){
  const one=(x0,lab,onAx,tol)=>{const y=74,R=24,w=96;let s=`<rect class="g-objf" x="${x0}" y="${y-R}" width="${w}" height="${R*2}"/><path class="g-ctr" d="M${x0-6} ${y}H${x0+w+6}"/>`;

    const ax=onAx?dx:x0+28,F=fcfG({sym:o.sym||'str',tol},ax-30,10);s+=F.svg+arrowG(ax,32,ax,y-R)+`<text class="g-tr" x="${x0+w/2}" y="${y+R+20}" text-anchor="middle">${lab}</text>`;return s;};

 // 位置度の判定：真位置（十字）と測定した穴の中心（点）、公差域（円）
 pos(o){

  const px=C[0]+dx*S,py=C[1]-dy*S;s+=`<path class="g-act" d="M${C[0]} ${C[1]}L${px} ${py}"/><circle class="g-dot" cx="${px}" cy="${py}" r="3.4"/>`;

  return{svg:s,vb:'0 0 320 160',cap:o.cap||(t?'位置度の公差域（円）と、測定した穴の中心':'真位置と、測定した穴の中心（図の縮尺は誇張）')};},

 // 動的公差線図（最大実体公差方式）：横軸は実寸法、縦軸は許される幾何公差

  const mms=o.mms,lms=o.lms,t=o.t,hole=lms>mms,X0=52,X1=286,Y0=128,Y1=18;
  const span=Math.abs(lms-mms),tmax=t+span,X=v=>X0+Math.abs(v-mms)/span*(X1-X0),Y=v=>Y0-v/tmax*(Y0-Y1);
  let s=`<path class="f-axis" d="M${X0} ${Y0}H${X1+10}M${X0} ${Y0}V${Y1-6}"/>`;
  s+=`<path class="g-zone" d="M${X(mms)} ${Y0}L${X(mms)} ${Y(t)}L${X(lms)} ${Y(tmax)}L${X(lms)} ${Y0}Z"/>`;
  s+=`<text class="g-ts" x="${X(mms)}" y="${Y0+13}" text-anchor="middle">${o.lmms||mms}（MMS）</text><text class="g-ts" x="${X(lms)}" y="${Y0+13}" text-anchor="middle">${o.llms||lms}（LMS）</text>`;
  s+=`<text class="g-ts" x="${X0-4}" y="${Y(t)+3}" text-anchor="end">${o.lt||t}</text><text class="g-ts" x="${X0-4}" y="${Y(tmax)+3}" text-anchor="end">${o.ltmax||+tmax.toFixed(3)}</text>`;
  if(o.act!=null){const a=o.act,ya=Y(t+Math.abs(a-mms));s+=`<path class="g-hid" d="M${X(a)} ${Y0}V${ya}H${X0}"/><circle class="g-dot" cx="${X(a)}" cy="${ya}" r="3.4"/><text class="g-t" x="${X(a)+5}" y="${ya-6}">実寸法 ${o.lact||a}</text>`;}
  s+=`<text class="g-ts" x="${X1}" y="${Y0+26}" text-anchor="end">${hole?'穴の実寸法 →':'軸の実寸法 →'}</text><text class="g-ts" x="${X0+4}" y="${Y1-8}">許される幾何公差</text>`;
  return{svg:s,vb:'0 0 320 160',cap:o.cap||'動的公差線図（塗りの範囲なら合格）'};},

 // 公差域の形の図（解説用）。o={k:'flat'|'round'|'cylax'|'par'|'run'}
 zone(o){

// 解説の図：問題文・解説の言葉から図を1つ選ぶ（問題に図の指定があるときはそちらを使う）
const FIGRULES=[['flat',/平面度の公差域|2平面のあいだ|平面度/],['round',/真円度/],['run',/円周振れ/],['par',/平行度/],['cylax',/軸線の真直度/]];

function figQ(spec){try{const f=FIG[spec[0]](spec[1]||{});return figHTML(f,true);}catch(e){return '';}}

 {k:'mmc',h:'最大実体公差方式（Ⓜ）とゼロ幾何公差',

 {k:'sq',h:'位置度の円と、座標の ± の正方形',

const FLASH_PEN=3;
let FL=null; // {qs, i, miss, t0, t1, lock, done, best:前回までの自己ベスト}
function flashNew(){
  const keys=shuffle(Object.keys(SYMP));

  FL={qs,i:0,miss:0,t0:Date.now(),t1:null,lock:false,done:false,best:(P.flash||{}).best||null,wrongAt:null};
}
function flashTime(){return ((FL.t1||Date.now())-FL.t0)/1000;}
function flashHTML(){
  const F=P.flash||{};
  if(!FL)return `<h2>記号フラッシュ</h2><div class="panel"><p style="margin-top:0">14の幾何特性の記号を、記号から名前、名前から記号の両方向でテンポよく答えます。1問まちがえるごとに ${FLASH_PEN} 秒を加算します。</p>
    <div class="kpis" style="margin:8px 0"><div class="panel kpi"><div class="lbl">自己ベスト</div><div class="v">${F.best?F.best.toFixed(1):'—'}<small>${F.best?'秒':''}</small></div></div><div class="panel kpi"><div class="lbl">挑戦した回数</div><div class="v">${F.plays||0}<small>回</small></div></div></div>

    <div class="actions" style="margin-top:12px"><button class="btn ghost" data-act="flashexit">ホームへ戻る</button></div>`;
  if(FL.done){const tot=FL.score,isBest=FL.best==null||tot<FL.best;
    return `<h2>記号フラッシュの結果</h2><div class="panel" style="text-align:center"><div class="lbl">合計タイム</div><div class="flbig">${tot.toFixed(1)}<small>秒</small></div>
      <p class="note">解答 ${FL.t.toFixed(1)} 秒 ＋ まちがい ${FL.miss} 回 × ${FLASH_PEN} 秒</p>${isBest?'<div class="verdict pass" style="font-size:1.3rem">自己ベスト更新！</div>':`<p class="note">自己ベスト ${FL.best.toFixed(1)} 秒</p>`}</div>
      <div class="actions" style="margin-top:12px"><button class="btn" data-act="flashgo">もう一度</button><button class="btn ghost" data-act="flashexit">ホームへ戻る</button></div>`;}
  const q=FL.qs[FL.i],n=FL.qs.length;
  const prompt=q.dir==='s2n'?`<div class="flsym">${symSVG(q.k)}</div><div class="note">この記号の名前は？</div>`:`<div class="flname">${esc(SYMN[q.k])}</div><div class="note">この幾何特性の記号は？</div>`;
  const opts=q.ch.map(k=>{const cl=FL.wrongAt===k?'wrong':FL.lock&&k===q.k?'right':'';return `<button class="opt flopt ${cl}" data-flash="${k}" ${FL.lock?'disabled':''}>${q.dir==='s2n'?`<span class="tx">${esc(SYMN[k])}</span>`:`<span class="gsym big">${symSVG(k)}</span>`}</button>`;}).join('');
  return `<div class="mockhead"><span class="timer-lbl" style="font-weight:700">${FL.i+1} / ${n}<span class="note" style="margin:0">・まちがい ${FL.miss}</span></span><span class="timer" id="fltime">${flashTime().toFixed(1)}</span></div>

    <div class="qcard flcard">${prompt}<div class="flopts${q.dir==='n2s'?' syms':''}">${opts}</div></div>

}
let flTimer=null;
function flashTick(){clearInterval(flTimer);if(!FL||FL.done)return;flTimer=setInterval(()=>{if(!FL||FL.done||view!=='flash'){clearInterval(flTimer);return;}const el=document.getElementById('fltime');if(el)el.textContent=flashTime().toFixed(1);},100);}
function flashAnswer(k){
  if(!FL||FL.done||FL.lock)return;const q=FL.qs[FL.i];
  if(k===q.k){sfx('right');FL.i++;FL.wrongAt=null;
    if(FL.i>=FL.qs.length){FL.t1=Date.now();FL.t=flashTime();FL.score=FL.t+FL.miss*FLASH_PEN;FL.done=true;clearInterval(flTimer);
      const F=P.flash=P.flash||{plays:0};F.plays=(F.plays||0)+1;if(F.best==null||FL.score<F.best)F.best=+FL.score.toFixed(1);if(!FL.miss)F.perfect=true;
      sfx(FL.best==null||FL.score<FL.best?'fanfare':'end');persist();}
    render();return;}
  // まちがえたら、正解を一瞬見せてから次へ進む
  sfx('wrong');FL.miss++;FL.wrongAt=k;FL.lock=true;render();
  setTimeout(()=>{if(!FL||FL.done)return;FL.lock=false;FL.wrongAt=null;FL.i++;if(FL.i>=FL.qs.length){FL.i--;flashAnswer(FL.qs[FL.i].k);return;}render();},650);
}

   case 'sprof':return `理論的に正確な輪郭面の上に中心をもつ直径 ${t} の球の包絡面2つのあいだ`;

   case 'perp':return RD.dia?`${p1} に直角な、直径 ${t} の円筒の中`:`${p1} に直角な、距離 ${t} の平行2平面のあいだ`;
   case 'ang':return RD.dia?`${p1}（軸線）に対して理論的に正確な角度で傾いた、直径 ${t} の円筒の中`:`${p1} に対して理論的に正確な角度で傾いた、距離 ${t} の平行2平面のあいだ`;
   case 'pos':return RD.dia?`${p} と理論的に正確な寸法で決まる真位置を軸線とする、直径 ${t} の円筒の中`:`${p} と理論的に正確な寸法で決まる真位置に対して対称な、距離 ${t} の平行2平面のあいだ`;

// 不適切な指示の指摘：[重さ 'ng'|'warn', 内容]
function rdIssues(){
  const s=RD.sym,g=RD_GRP[s],f=RD.feat,d=rdDats(),D=rdDlist(),t=rdNum(RD.tol),out=[];
  const ng=x=>out.push(['ng',x]),warn=x=>out.push(['warn',x]);
  if(t==null||t<0)ng('公差値が数値になっていない。');
  if(t===0&&!RD.m)ng('公差値 0 は、Ⓜ（または Ⓛ）と組み合わせたゼロ幾何公差のときだけ使える。Ⓜ なしの 0 は、形体を完全な形・位置に作れという意味になり、製作も検査もできない。');
  // データムの有無
  if(g==='form'&&D.length)ng(`${SYMN[s]}は形状公差なので、データムを書かない。データムに対する向きまで規制したいなら、${s==='flat'?'平行度・直角度':'姿勢公差'}を使う。`);
  if((g==='orient'||g==='run'||s==='coax'||s==='sym')&&!D.length)ng(`${SYMN[s]}にはデータムが必要。何に対して${g==='run'?'回転させるか':'の関係か'}が決まらない。`);
  if(s==='pos'&&!D.length)warn('データムのない位置度は、穴どうしの位置関係（パターン）だけを規制し、部品の外形に対する位置は規制しない（JIS B 0021・JIS B 0025 の考え方）。ISO 1101:2017・ISO 5458:2018 では、パターンとして1つにまとめるなら CZ を明記する。外形に対する位置が必要ならデータムを付ける。ASME は原則としてデータムを付ける。');
  if(d[0]==='—'&&(d[1]!=='—'||d[2]!=='—')||d[1]==='—'&&d[2]!=='—')ng('データムの区画が飛んでいる。第1次から順に詰めて書く。');
  const base=D.map(x=>x.replace('(M)','')),dup=base.some((x,i)=>base.indexOf(x)!==i||(x==='A-B'&&base.some(y=>y==='A'||y==='B')));
  if(dup)ng('同じデータムが2回出てくる。1つの文字は1つの区画にだけ書く。');
  if(g==='orient'&&D.length===3)warn('姿勢公差は向き（回転）だけを規制するので、第3次データムまで要ることは少ない。位置を決めたいなら位置度か輪郭度を使う。');

  if(RD.dia&&['flat','circ','cyl','run','trun','sym','lprof','sprof'].includes(s))ng(`${SYMN[s]}の公差域は円筒ではない（${s==='circ'||s==='cyl'||s==='run'||s==='trun'?'半径の差で決まる':s==='lprof'||s==='sprof'?'輪郭に沿った帯の':'平行2平面の'}公差域）ので、φ を付けない。`);
  if(RD.dia&&(f==='plane'||f==='slot'||f==='surf')&&['str','par','perp','ang','pos','coax'].includes(s))ng('平面・幅の中心平面の公差域は2平面なので、φ を付けない。φ は穴・軸の軸線のように、円筒の公差域にするときだけ付ける。');
  if(!RD.dia&&s==='coax')ng('同軸度の公差域は円筒なので、公差値に φ を付ける。');
  if(!RD.dia&&s==='pos'&&(f==='hole'||f==='shaft'))warn('穴・軸の位置度で φ を付けないと、指示線の方向だけの2平面の公差域になる。全方向に同じだけ許すなら φ を付ける。');
  // Ⓜ の付け方
  if(RD.m&&!rdSize())ng('Ⓜ はサイズ形体（穴・軸・溝などの幅）にだけ使える。平面や曲面には最大実体寸法がないので、Ⓜ を付けられない。');
  if(RD.m&&['circ','cyl','lprof','sprof','run','trun'].includes(s))ng(`${SYMN[s]}には Ⓜ を使えない（表面そのものを規制する特性なので、サイズによるボーナスの考え方が当てはまらない）。`);
  if(RD.m&&s==='str'&&!RD.dia&&(f==='hole'||f==='shaft'))ng('φ のない真直度は表面の線を規制するので、Ⓜ を付けられない。Ⓜ を使うなら、寸法線の延長上に指示して φ を付け、軸線の真直度にする。');
  if(g==='run'&&D.some(x=>/\(M\)/.test(x)))ng('振れ公差は、データム軸線のまわりに実際に回して測るので、データムに Ⓜ を付けない（ASME もデータムは RMB に限る）。');
  // 形体と記号の組合せ
  if((f==='plane'||f==='slot')&&['circ','cyl','coax'].includes(s))ng(`${SYMN[s]}は円筒・円すいなどの回転形体に使う。${f==='plane'?'平面':'溝の幅'}には使えない。`);
  if(f==='slot'&&(s==='run'||s==='trun'))ng(`${SYMN[s]}は回転形体の表面か、軸の端面に使う。溝の幅には使えない。`);
  if((f==='hole'||f==='shaft')&&s==='flat')ng('円筒の面に平面度は使えない。円筒の形なら円筒度、断面の丸さなら真円度を使う。');
  if((f==='hole'||f==='shaft')&&s==='sym')warn('対称度は幅の中心平面に使う。穴・軸の中心のずれなら、位置度か同軸度を使う。');

  // ASME との違い
  if(s==='coax'||s==='sym')warn(`ASME Y14.5-2018 では${s==='coax'?'同心度（同軸度）':'対称度'}の記号が廃止された。ASME の図面では位置度・輪郭度・振れで指示する。`);

}
function rdMMC(){
