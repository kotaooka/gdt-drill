# Android 用 APK をビルドする。
# - main へのプッシュ：Actions の実行結果（Artifacts）に APK を置く
# - GitHub の画面でリリースを公開したとき：そのリリースに APK を添付する
name: android
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 署名鍵は Secrets に入れておく（README「自動ビルドの署名設定」を参照）
      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secrets に KEYSTORE_BASE64 がありません"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: APK をビルド
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || format('dev.{0}', github.run_number) }}
        # 版数は 100＋実行番号（手元で作った APK（〜2.0.1 は 18）より必ず大きくして、上書きインストールできるようにする）
        run: VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) gradle assembleRelease --no-daemon --stacktrace

      - name: ファイル名を整える
        run: cp android/app/build/outputs/apk/release/app-release.apk gdt-drill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gdt-drill-apk
          path: gdt-drill.apk

      - name: リリースに添付（リリース公開時だけ）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: gdt-drill.apk
